<nav class="activitybar" :aria-label="i18n.sidebar.mainNav">
  <div class="activity-group">
    <button class="activity-item" :class="viewClasses.sessions" data-action="view" data-view="sessions" @click="onAction"
            :aria-pressed="viewFlags.sessions"
            :title="i18n.nav.sessions" :aria-label="i18n.nav.sessions">
      <svg class="icon" aria-hidden="true"><use href="#i-chat"></use></svg>
    </button>
    <button class="activity-item" :class="viewClasses.files" data-action="view" data-view="files" @click="onAction"
            :aria-pressed="viewFlags.files"
            :title="i18n.nav.files" :aria-label="i18n.nav.files">
      <svg class="icon" aria-hidden="true"><use href="#i-files"></use></svg>
      <span class="activity-dot" x-show="filesDirty" aria-hidden="true"></span>
    </button>
    <button class="activity-item" :class="viewClasses.tree" data-action="view" data-view="tree" @click="onAction"
            :aria-pressed="viewFlags.tree"
            :title="i18n.nav.tree" :aria-label="i18n.nav.tree">
      <svg class="icon" aria-hidden="true"><use href="#i-tree"></use></svg>
    </button>
    <button class="activity-item" :class="viewClasses.git" data-action="view" data-view="git" @click="onAction"
            :aria-pressed="viewFlags.git"
            :title="i18n.nav.git" :aria-label="i18n.nav.git">
      <svg class="icon" aria-hidden="true"><use href="#i-git"></use></svg>
    </button>
    <button class="activity-item" :class="viewClasses.tasks" data-action="view" data-view="tasks" @click="onAction"
            :aria-pressed="viewFlags.tasks"
            :title="i18n.nav.tasks" :aria-label="i18n.nav.tasks">
      <svg class="icon" aria-hidden="true"><use href="#i-tasks"></use></svg>
      <span class="activity-dot" x-show="tasksDirty" aria-hidden="true"></span>
    </button>
    <button class="activity-item" :class="viewClasses.memory" data-action="view" data-view="memory" @click="onAction"
            :aria-pressed="viewFlags.memory"
            :title="i18n.nav.memory" :aria-label="i18n.nav.memory">
      <svg class="icon" aria-hidden="true"><use href="#i-memory"></use></svg>
    </button>
    <button class="activity-item" :class="viewClasses.library" data-action="view" data-view="library" @click="onAction"
            x-show="libraryEnabled"
            :aria-pressed="viewFlags.library"
            :title="i18n.nav.library" :aria-label="i18n.nav.library">
      <svg class="icon" aria-hidden="true"><use href="#i-library"></use></svg>
    </button>
    <button class="activity-item" :class="viewClasses.audit" data-action="view" data-view="audit" @click="onAction"
            :aria-pressed="viewFlags.audit"
            :title="i18n.nav.audit" :aria-label="i18n.nav.audit">
      <svg class="icon" aria-hidden="true"><use href="#i-audit"></use></svg>
    </button>
    <button class="activity-item" :class="viewClasses.problems" data-action="view" data-view="problems" @click="onAction"
            :aria-pressed="viewFlags.problems"
            :title="i18n.nav.problems" :aria-label="i18n.nav.problems">
      <svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg>
      <span class="activity-badge" x-show="hasProblems" x-text="problems.length"></span>
    </button>
  </div>
  <span class="spacer"></span>
  <button class="activity-item" @click="toggleSettings" :title="i18n.nav.settings" :aria-label="i18n.nav.settings">
    <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
  </button>
</nav>

<aside class="sidebar" id="sidebar-panel" x-show="sidebarVisible">
  <div class="sidebar-head">
    <h3 x-text="viewTitle">会话</h3>
    <div class="row">
      <button class="icon-btn" x-show="viewFlags.sessions" @click="newSession"
              :title="i18n.sidebar.newSession" :aria-label="i18n.sidebar.newSession">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
      </button>
      <button class="icon-btn" @click="toggleSidebar" :title="i18n.sidebar.collapse" :aria-label="i18n.sidebar.collapse">
        <svg class="icon" aria-hidden="true"><use href="#i-panel-left"></use></svg>
      </button>
    </div>
  </div>

  <div class="sidebar-body">
    <div class="view" x-show="viewFlags.sessions">
      <div class="session-form">
        <div x-show="capabilities.workspace_registry">
          <label x-text="i18n.sidebar.project"></label>
          <div class="row">
            <select x-model="projectId" @change="selectCurrentProject"
                    :aria-label="i18n.sidebar.chooseProject">
              <option value="" x-text="i18n.sidebar.chooseProject"></option>
              <template x-for="p in projects" :key="p.workspace_id">
                <option :value="p.workspace_id" x-text="p._label"></option>
              </template>
            </select>
            <button @click="registerHostWorkspace" :disabled="projectBusy"
                    :title="i18n.sidebar.localHint" x-text="i18n.sidebar.local"></button>
          </div>
          <div class="note" x-show="noProjects" x-text="i18n.sidebar.noProjects"></div>
          <div class="note" x-text="i18n.sidebar.switchProjectNote"></div>
          <div class="note note-ok" x-show="threadId">
            <span x-text="i18n.sidebar.boundLabel"></span><span x-text="workspaceDisplay"></span><span x-text="i18n.sidebar.immutable"></span>
          </div>
          <input x-model="workspaceInput" readonly
                 :placeholder="workspaceInputPlaceholder">
        </div>
        <div x-show="noWorkspaceRegistry">
          <label x-text="i18n.sidebar.workspace"></label>
          <div class="row">
            <input x-model="workspaceInput" :placeholder="i18n.sidebar.workspacePlaceholder">
            <button class="secondary" x-show="desktopAvailable" @click="pickWorkspace" x-text="i18n.sidebar.choose"></button>
          </div>
        </div>
        <label for="access-mode" x-text="i18n.sidebar.access"></label>
        <select id="access-mode" x-model="accessMode" :disabled="accessDisabled">
          <option value="read_only" x-text="i18n.sidebar.readOnly"></option>
          <option value="write_ask" x-show="capabilities.server_write_enabled" x-text="i18n.sidebar.writeAsk"></option>
          <option value="write_auto" x-show="capabilities.server_write_enabled" x-text="i18n.sidebar.writeAuto"></option>
        </select>
        <label for="model-select" x-text="i18n.sidebar.model"></label>
        <select id="model-select" x-model="model" @change="syncModel">
          <option value="" x-text="i18n.sidebar.defaultModel"></option>
          <template x-for="p in providers" :key="p._key">
            <option :value="p.model" x-text="p._label"></option>
          </template>
        </select>
        <button @click="switchModel" :disabled="applyModelDisabled" x-text="i18n.sidebar.applyModel"></button>
        <button class="primary" @click="createSession" :disabled="createSessionDisabled" x-text="i18n.sidebar.createSession"></button>
        <label class="upload-label">
          <span x-text="i18n.sidebar.importSession"></span>
          <input type="file" accept=".json,application/json" @change="importSessionFile">
        </label>
      </div>
      <input class="session-search" x-model="sessionQuery" @input="onSessionSearchInput"
             :placeholder="i18n.sidebar.searchSessions">
      <div class="session-filters">
        <button :class="sessionFilterClasses.all" data-action="session-filter" data-filter="all" @click="onAction" x-text="i18n.sidebar.all"></button>
        <button :class="sessionFilterClasses.pinned" data-action="session-filter" data-filter="pinned" @click="onAction" x-text="i18n.sidebar.pinned"></button>
        <button :class="sessionFilterClasses.archived" data-action="session-filter" data-filter="archived" @click="onAction" x-text="i18n.sidebar.archived"></button>
      </div>
      <div class="skeleton-list" x-show="sessionsSkeletonVisible" aria-hidden="true">
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
      </div>
      <div class="session-batch" x-show="hasSessionSelection">
        <span x-text="sessionSelectionText"></span>
        <button data-action="session-batch" data-op="archive" @click="onAction">归档</button>
        <button data-action="session-batch" data-op="unarchive" @click="onAction">取消归档</button>
        <button class="danger" data-action="session-batch" data-op="delete" @click="onAction">删除</button>
        <button data-action="session-batch" data-op="clear" @click="onAction">取消</button>
      </div>
      <div class="session-list">
        <template x-for="s in sessionRows" :key="s.thread_id">
          <div class="session-entry">
            <div class="session-group" x-show="s._showGroup"
                 x-text="s._groupLabel"></div>
            <div class="session-item" :class="s._cls" data-action="session" data-op="open" :data-id="s.thread_id" @click="onAction">
              <div class="t">
                <input type="checkbox" class="session-check" :checked="s._selected"
                       :aria-label="s._selectTitle"
                       data-action="session-select" :data-id="s.thread_id" @click.stop="onAction">
                <span class="session-unread-dot" x-show="s.unread" title="未读"></span>
                <span class="session-pin" x-show="s.pinned" title="已置顶">★</span>
                <span x-text="s._title"></span>
              </div>
              <div class="session-preview" x-show="s._preview" x-text="s._preview"></div>
              <div class="session-tags" x-show="s._hasTags">
                <template x-for="tag in s.tags" :key="tag">
                  <span class="session-tag" x-text="tag"></span>
                </template>
              </div>
              <div class="m" x-text="s._meta"></div>
              <div class="session-actions">
                <button data-action="session" data-op="pin" :data-id="s.thread_id" @click.stop="onAction"
                        x-text="s._pinLabel"></button>
                <button data-action="session" data-op="archive" :data-id="s.thread_id" @click.stop="onAction"
                        x-text="s._archiveLabel"></button>
                <button data-action="session" data-op="unread" :data-id="s.thread_id" @click.stop="onAction"
                        x-text="s._unreadLabel"></button>
                <button data-action="session" data-op="split" :data-id="s.thread_id" @click.stop="onAction">分屏</button>
                <button data-action="session" data-op="compare" :data-id="s.thread_id" @click.stop="onAction">对比</button>
                <button data-action="session" data-op="share" :data-id="s.thread_id" @click.stop="onAction">分享</button>
                <button data-action="session" data-op="tags" :data-id="s.thread_id" @click.stop="onAction">标签</button>
                <button data-action="session" data-op="rename" :data-id="s.thread_id" @click.stop="onAction">改名</button>
                <button data-action="session" data-op="export" :data-id="s.thread_id" @click.stop="onAction">导出</button>
                <button data-action="session" data-op="export-json" :data-id="s.thread_id" @click.stop="onAction" x-text="i18n.sidebar.exportJson"></button>
                <button class="danger" data-action="session" data-op="delete" :data-id="s.thread_id" @click.stop="onAction">删除</button>
              </div>
            </div>
          </div>
        </template>
        <button class="session-more" x-show="sessionHasMore" @click="loadMoreSessions"
                :disabled="sessionsLoading" x-text="i18n.sidebar.loadMore"></button>
        <div class="empty" x-show="noSessions">没有匹配的会话</div>
      </div>
    </div>

    <div class="view" x-show="viewFlags.files">
      <div class="panel-actions">
        <button @click="loadSnapshots">刷新快照</button>
        <button @click="restoreRun">回滚本轮</button>
        <button @click="downloadCurrentPatch" x-text="i18n.sidebar.downloadPatch"></button>
        <button @click="loadCheckpoints">检查点</button>
      </div>
      <template x-for="c in checkpoints" :key="c.checkpoint_id">
        <div class="file-card">
          <div class="file-head">
            <span x-text="c.step"></span>
            <span x-text="c.checkpoint_id"></span>
            <span x-text="c.preview"></span>
            <button data-action="checkpoint" data-op="fork" :data-id="c.checkpoint_id" @click="onAction">分叉</button>
            <button class="danger" data-action="checkpoint" data-op="rewind" :data-id="c.checkpoint_id" @click="onAction">回退到此</button>
          </div>
        </div>
      </template>
      <template x-for="f in files" :key="f._key">
        <div class="file-card">
          <div class="file-head">
            <span x-text="f.path"></span>
            <button data-action="file" data-op="diff" :data-snapshot="f.snapshot_id" :data-path="f.path" @click="onAction">查看 diff</button>
            <button data-action="file" data-op="accept" :data-key="f._key" @click="onAction">接受</button>
            <button class="danger" data-action="file" data-op="reject" :data-snapshot="f.snapshot_id" :data-path="f.path" @click="onAction">拒绝（回滚）</button>
          </div>
        </div>
      </template>
      <div class="note">查看 diff 会在主区打开标签页。</div>
      <div class="note">接受 = 保留当前内容；拒绝 = 恢复到快照前的内容（回滚前会再留底）。</div>
      <div class="empty" x-show="filesEmptyState">还没有文件改动</div>
    </div>

    <div class="view" x-show="viewFlags.tree">
      <div class="panel-actions">
        <button @click="refreshTree">刷新</button>
        <button @click="collapseAllTree">收起全部</button>
        <span class="note" x-text="treeLoadingText"></span>
      </div>
      <div class="note" x-show="treeGitState" x-text="treeGitState"></div>
      <input class="tree-search" x-model="treeQuery" placeholder="过滤已加载文件…">
      <div class="tree-list" role="tree" aria-label="文件树" @keydown="onTreeKeydown">
        <div class="skeleton-list" x-show="treeSkeletonVisible" aria-hidden="true">
          <div class="skeleton skeleton-row"></div>
          <div class="skeleton skeleton-row"></div>
          <div class="skeleton skeleton-row"></div>
          <div class="skeleton skeleton-row"></div>
        </div>
        <template x-for="entry in filteredTreeResults" :key="entry._key">
          <div class="tree-row" :class="entry._cls"
               :style="entry._style"
               role="treeitem" :aria-level="entry._level" :aria-expanded="entry._expandAttr"
               :tabindex="entry._tabindex" @focus="onTreeFocus"
               data-action="tree" :data-path="entry.path" :data-dir="entry.is_dir" @click="onAction">
          <template x-for="g in entry._guides" :key="g._key">
            <span class="tree-guide" :style="g._style" aria-hidden="true"></span>
          </template>
          <span class="tree-kind" aria-hidden="true">
            <svg class="tree-icon" :class="entry._iconCls"><use :href="entry._iconId"></use></svg>
          </span>
          <span class="tree-git" :class="entry._gitCls" :title="entry._gitTitle"
                x-show="entry._git" x-text="entry._git"></span>
          <span class="tree-name" x-text="entry.name"></span>
          <span class="note" x-text="entry._meta"></span>
          <button class="tree-copy" data-action="copy-path" :data-path="entry.path" @click.stop="onAction" title="复制路径">复制路径</button>
        </div>
      </template>
      </div>
      <div class="empty" x-show="treeEmpty">没有匹配的文件，或目录为空</div>
      <div class="note">↑↓ 移动，→ 展开，← 折叠，Enter 打开；点击同样可用。</div>
    </div>

    <div class="view" x-show="viewFlags.git">
      <div class="panel-actions">
        <button data-action="load-git" data-diff="false" @click="onAction">刷新状态</button>
        <button data-action="load-git" data-diff="true" @click="onAction">查看 diff</button>
        <span class="note" x-text="gitInfo._state"></span>
      </div>
      <div class="note" x-text="gitInfo._branch"></div>
      <template x-for="row in gitInfo._changes" :key="row._key">
        <div class="tree-row"><span x-text="row._text"></span></div>
      </template>
      <template x-for="row in gitInfo._commits" :key="row._key">
        <div class="note" x-text="row._text"></div>
      </template>
      <div class="note" x-show="gitDiffTabOpen">Git diff 已在主区标签中打开。</div>
    </div>

    <div class="view" x-show="viewFlags.tasks">
      <template x-for="task in tasks" :key="task._idText">
        <div class="task-card" :class="task._cls">
          <div class="task-line">
            <span class="task-id" x-text="task._idText"></span>
            <span class="task-role" x-text="task.role"></span>
            <span class="task-status" x-text="task._status"></span>
          </div>
          <div class="task-goal" x-text="task._goalText"></div>
          <div class="task-meta">
            <span x-show="task._depends" x-text="task._depends"></span>
            <span x-show="task._worker" x-text="task._workerText"></span>
            <span x-show="task._timing" x-text="task._timing"></span>
            <span x-show="task._tokens" x-text="task._tokens"></span>
            <span x-show="task._toolCallsText" x-text="task._toolCallsText"></span>
            <span class="note-bad" x-show="task.merge_error" x-text="task.merge_error"></span>
          </div>
        </div>
      </template>
      <div class="empty" x-show="noTasks">没有编排任务</div>
    </div>

    <div class="view" x-show="viewFlags.memory">
      <div class="panel-actions">
        <input x-model="memoryText" placeholder="新增一条项目记忆">
        <button @click="remember">记住</button>
      </div>
      <template x-for="(fact, i) in memory" :key="i">
        <div class="memory-item">
          <span x-text="fact"></span>
          <button class="danger" data-action="memory-forget" :data-index="i" @click="onAction">删除</button>
        </div>
      </template>
      <div class="empty" x-show="noMemory">没有项目记忆</div>
    </div>

    <div class="view" x-show="viewFlags.library">
      <div class="panel-actions">
        <label class="upload-label">
          <span x-text="i18n.library.upload"></span>
          <input type="file" multiple
                 accept=".pdf,.docx,.md,.markdown,.txt,.text,.xlsx,.xlsm,.pptx,.html,.htm,.epub,.csv,.tsv"
                 @change="uploadLibraryFiles" :disabled="libraryBusy">
        </label>
        <button @click="loadLibrary" x-text="i18n.library.refresh"></button>
        <button @click="reindexAllLibrary" x-text="i18n.library.reindexAll"></button>
        <span class="note" x-text="libraryUsage"></span>
      </div>
      <div class="upload-progress" x-show="libraryBusy" role="status" aria-live="polite">
        <progress max="100" :value="libraryPercent" :aria-label="i18n.library.uploading"></progress>
        <span x-text="libraryText"></span>
      </div>
      <div class="note note-bad" x-show="libraryError" x-text="libraryError"></div>
      <div class="library-filters">
        <select x-model="libraryStatusFilter" @change="applyLibraryFilters"
                :aria-label="i18n.library.filters">
          <option value="" x-text="i18n.library.statusAll"></option>
          <option value="ready" x-text="i18n.library.statusReady"></option>
          <option value="processing" x-text="i18n.library.statusProcessing"></option>
          <option value="failed" x-text="i18n.library.statusFailed"></option>
          <option value="needs_ocr" x-text="i18n.library.statusNeedsOcr"></option>
        </select>
        <input x-model="libraryTagFilter" @keydown.enter.prevent="applyLibraryFilters"
               :placeholder="i18n.library.tagFilterPlaceholder"
               :aria-label="i18n.library.tagFilterPlaceholder">
        <input x-model="libraryQueryFilter" @keydown.enter.prevent="applyLibraryFilters"
               :placeholder="i18n.library.queryFilterPlaceholder"
               :aria-label="i18n.library.queryFilterPlaceholder">
        <button @click="applyLibraryFilters" x-text="i18n.library.applyFilters"></button>
      </div>
      <div class="library-search">
        <input x-model="libraryQuery" @keydown.enter.prevent="searchLibrary"
               :placeholder="i18n.library.searchPlaceholder"
               :aria-label="i18n.library.searchPlaceholder">
        <select x-model="librarySearchMode" :aria-label="i18n.library.searchMode">
          <option value="" x-text="i18n.library.modeDefault"></option>
          <option value="lexical" x-text="i18n.library.modeLexical"></option>
          <option value="vector" x-text="i18n.library.modeVector"></option>
          <option value="hybrid" x-text="i18n.library.modeHybrid"></option>
        </select>
        <button @click="searchLibrary" :disabled="librarySearchBusy"
                x-text="i18n.library.search"></button>
      </div>
      <div class="note note-bad" x-show="librarySearchError" x-text="librarySearchError"></div>
      <div class="note" x-show="librarySearchBusy">…</div>
      <template x-for="hit in libraryResults" :key="hit._key">
        <div class="library-result">
          <div class="library-result-head">
            <span class="library-source" x-text="hit._source"></span>
            <span class="note" x-text="hit._mode"></span>
            <span class="note" x-text="hit._score"></span>
          </div>
          <div class="note" x-text="hit._title"></div>
          <pre class="library-snippet" x-text="hit._snippet"></pre>
        </div>
      </template>
      <div class="empty" x-show="libraryResultsEmpty" x-text="i18n.library.resultsEmpty"></div>
      <div class="library-detail" x-show="libraryDetailId" x-cloak>
        <div class="library-detail-head">
          <span class="library-name" x-text="libraryDetailTitle"></span>
          <button @click="closeLibraryDetail" x-text="i18n.library.closeDetail"></button>
        </div>
        <div class="note" x-show="libraryDetailLoading">…</div>
        <div class="note note-bad" x-show="libraryDetailError" x-text="libraryDetailError"></div>
        <div class="library-tags">
          <template x-for="tag in libraryDetailTags" :key="tag">
            <span class="library-tag" x-text="tag"></span>
          </template>
        </div>
        <div class="library-detail-section">
          <h4 x-text="i18n.library.outline"></h4>
          <template x-for="entry in libraryDetailOutline" :key="entry._key">
            <div class="library-outline-item" x-text="entry._label"></div>
          </template>
        </div>
        <div class="library-detail-section">
          <h4 x-text="libraryDetailChunkText"></h4>
          <template x-for="chunk in libraryDetailChunks" :key="chunk._key">
            <div class="library-chunk">
              <div class="library-source" x-text="chunk._source"></div>
              <pre class="library-snippet" x-text="chunk.text"></pre>
            </div>
          </template>
        </div>
      </div>
      <template x-for="item in libraryItems" :key="item.item_id">
        <div class="library-item">
          <div class="library-item-head">
            <span class="library-name" x-text="item.name"></span>
            <span class="note" x-text="item._meta"></span>
          </div>
          <div class="library-item-status">
            <span x-text="item._status"></span>
            <span class="note note-bad" x-show="item._error" x-text="item._error"></span>
          </div>
          <div class="library-tags" x-show="item._tags.length">
            <template x-for="tag in item._tags" :key="tag">
              <span class="library-tag" x-text="tag"></span>
            </template>
          </div>
          <div class="library-progress" x-show="item._active" role="status" aria-live="polite">
            <progress max="100" :value="item._progress" :aria-label="item._stageLabel"></progress>
            <span class="note" x-text="item._stageLabel"></span>
          </div>
          <div class="library-item-actions">
            <button data-action="library-detail" :data-id="item.item_id"
                    @click="onAction" x-text="i18n.library.detail"></button>
            <button data-action="library-tags" :data-id="item.item_id"
                    @click="onAction" x-text="i18n.library.editTags"></button>
            <button x-show="item._canCancel" data-action="library-cancel" :data-id="item._jobId"
                    @click="onAction" x-text="i18n.library.cancel"></button>
            <button x-show="item._canReindex" data-action="library-reindex" :data-id="item.item_id"
                    @click="onAction" x-text="i18n.library.reindex"></button>
            <button class="danger" x-show="item._canDelete" data-action="library-delete" :data-id="item.item_id"
                    @click="onAction" x-text="i18n.library.delete"></button>
          </div>
        </div>
      </template>
      <div class="empty" x-show="libraryEmpty" x-text="i18n.library.empty"></div>
      <div class="library-pagination">
        <button @click="libraryPrevPage" :disabled="libraryPrevDisabled"
                x-text="i18n.library.prevPage"></button>
        <span class="note" x-text="libraryPageText"></span>
        <button @click="libraryNextPage" :disabled="libraryNextDisabled"
                x-text="i18n.library.nextPage"></button>
      </div>
      <div class="note" x-text="i18n.library.hint"></div>
    </div>

    <div class="view" x-show="viewFlags.audit">
      <div class="panel-actions">
        <button @click="loadAudit">刷新审计</button>
      </div>
      <template x-for="(r, i) in audit" :key="i">
        <div class="audit-row">
          <span x-text="r.ts"></span>
          <span x-text="r.kind"></span>
          <span x-text="r._text"></span>
        </div>
      </template>
      <div class="empty" x-show="noAudit">没有审计记录</div>
    </div>

    <div class="view" x-show="viewFlags.problems">
      <div class="panel-actions">
        <button @click="clearProblems">清空</button>
        <span class="note" x-text="problemsCountText"></span>
      </div>
      <template x-for="g in problemGroups" :key="g._key">
        <div class="problem-group" :class="g._cls">
          <button class="problem-group-head"
                  data-action="problem-group" :data-group="g._key" @click="onAction">
            <span class="problem-group-toggle" x-text="g._toggle"></span>
            <span class="problem-group-label" x-text="g._label"></span>
            <span class="problem-group-count" x-text="g._countText"></span>
          </button>
          <template x-if="g._open">
            <div class="problem-group-items">
              <template x-for="p in g._items" :key="p.id">
                <div class="problem-card" :class="p._itemCls" :data-path="p._path" @click="onProblemClick">
                  <div class="problem-head">
                    <span class="problem-kind" x-text="p.kind"></span>
                    <span class="problem-title" x-text="p.title"></span>
                    <span class="note" x-show="p._clickable">打开文件 ↗</span>
                  </div>
                  <pre class="problem-detail" x-show="p.detail" x-text="p.detail"></pre>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
      <div class="empty" x-show="noProblems">没有诊断问题</div>
    </div>
  </div>
</aside>

<div class="splitter splitter-left" x-show="sidebarVisible"
     data-side="sidebar" @pointerdown="onStartResize"
     role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度"></div>
