<div class="notification-panel" x-show="notificationsOpen" x-cloak
     @click.outside="closeNotifications" role="dialog" :aria-label="i18n.notifications.title">
  <div class="notification-head">
    <h3 x-text="i18n.notifications.title"></h3>
    <span class="notification-unread" x-show="hasUnreadNotifications"
          x-text="unreadNotificationsText"></span>
    <button class="icon-btn" @click="markNotificationsRead" :title="i18n.notifications.markAllRead" :aria-label="i18n.notifications.markAllRead">
      <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>
    </button>
    <button class="icon-btn" @click="clearNotifications" :title="i18n.notifications.clear" :aria-label="i18n.notifications.clear">
      <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="notification-list" aria-live="polite">
    <template x-for="item in notifications" :key="item.id">
      <div class="notification-item" :class="item._cls"
           :data-id="item.id" @click="openNotification">
        <div class="notification-title" x-text="item.title"></div>
        <div class="notification-body" x-show="item.body" x-text="item.body"></div>
        <div class="notification-time" x-text="item.time"></div>
      </div>
    </template>
    <div class="empty" x-show="noNotifications" x-text="i18n.notifications.empty"></div>
  </div>
</div>

<footer class="statusbar" role="contentinfo" x-show="ready" x-cloak>
  <span class="status-item" :title="healthText">
    <span class="status-dot" :class="connectionClass"></span>
    <span x-text="stateText"></span>
  </span>
  <span class="status-item connection" x-show="connectionLabel" x-cloak x-text="connectionLabel"></span>
  <span class="status-item badge" :class="badgeClasses" x-text="accessLabel"></span>
  <span class="status-item" x-text="modelLabel"></span>
  <span class="status-item status-workspace" x-text="workspaceLabel"></span>
  <span class="status-item" x-show="gitInfo._branch" x-text="gitInfo._branch"></span>
  <span class="spacer"></span>
  <span class="status-item" x-show="usageLabel" :title="usageTitle" x-text="usageLabel"></span>
  <span class="status-item" x-text="costText"></span>
  <span class="status-item status-health" x-text="healthText"></span>
  <button class="status-item status-command" @click="openCommandPalette" title="打开命令面板">
    Ctrl Shift P
  </button>
</footer>

<div class="toast-stack" aria-live="polite" aria-relevant="additions">
  <template x-for="item in toasts" :key="item.id">
    <div class="toast" :class="item._cls" role="status">
      <svg class="icon" aria-hidden="true"><use :href="item._icon"></use></svg>
      <span x-text="item.text"></span>
      <span class="toast-progress" aria-hidden="true"></span>
    </div>
  </template>
</div>
</div>

<script
  src="/static/vendor/marked.min.js"
  integrity="sha384-4McoXpvghOs4u8yusAJ/YptFNkbwl1FhDrMosUI/kT0yXFZNj+g/BTCq4zcICV06"
  crossorigin="anonymous"
></script>
<script
  src="/static/vendor/purify.min.js"
  integrity="sha384-8hAfZQ5Oqos5HLTHfR0sLvvwpcVI4fGhV+0Dj/HCcpkKaacivQs82XHmvLOnAhXn"
  crossorigin="anonymous"
></script>
<script
  src="/static/vendor/highlight.min.js"
  integrity="sha384-QmlWT7zAOvaId/AAkBCNvUxhDKbTOA4Gcgev+jtuRgVPFYZfWUh9bUfPVfmkGQZD"
  crossorigin="anonymous"
></script>
<script
  src="/static/vendor/alpine-csp.min.js"
  integrity="sha384-e8CG07Vu3gHPYbMUM0Xk939uX+8s2GCFFDO23/R7yLYmr2jNz2YtLSvMLKervpEu"
  crossorigin="anonymous"
></script>
<nav class="mobile-nav" x-show="ready" x-cloak :aria-label="i18n.mobile.nav">
  <button :class="mobilePaneClasses.sessions" data-action="mobile-pane"
          data-pane="sessions" @click="onAction">
    <svg class="icon" aria-hidden="true"><use href="#i-files"></use></svg>
    <span x-text="i18n.mobile.sessions"></span>
    <span class="mobile-badge" x-show="unreadSessionCount"
          x-text="unreadSessionCount"></span>
  </button>
  <button :class="mobilePaneClasses.chat" data-action="mobile-pane"
          data-pane="chat" @click="onAction">
    <svg class="icon" aria-hidden="true"><use href="#i-chat"></use></svg>
    <span x-text="i18n.mobile.chat"></span>
  </button>
  <button :class="mobilePaneClasses.approvals" data-action="mobile-pane"
          data-pane="approvals" @click="onAction">
    <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>
    <span x-text="i18n.mobile.approvals"></span>
    <span class="mobile-badge" x-show="mobileApprovalCount"
          x-text="mobileApprovalCount"></span>
  </button>
</nav>
<script src="/static/app.js"></script>
</body>
</html>
