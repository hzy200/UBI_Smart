<header x-show="ready" x-cloak>
  <button class="icon-btn" @click="toggleSidebar" :aria-label="i18n.header.toggleSidebar"
          :aria-expanded="sidebarExpanded" aria-controls="sidebar-panel"
          :title="i18n.header.toggleSidebarHint">
    <svg class="icon" aria-hidden="true"><use href="#i-panel-left"></use></svg>
  </button>
  <div class="brand pywebview-drag-region" @dblclick="toggleDesktopMaximize">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M7 6l5 6-5 6"/><path d="M14 18h4"/></svg>
    </span>
    <span class="name">CodingAgent</span>
  </div>
  <span class="meta model" :title="modelLabel" x-text="modelLabel"></span>
  <span class="badge" :class="badgeClasses" x-text="accessLabel"></span>
  <span class="meta workspace" :title="workspaceLabel">
    <svg class="icon meta-icon" aria-hidden="true"><use href="#i-folder"></use></svg>
    <span class="workspace-path" x-text="workspaceLabel"></span>
  </span>
  <button class="command-trigger" @click="openCommandPalette" :aria-label="i18n.header.command">
    <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
    <span x-text="i18n.header.command"></span>
    <kbd>Ctrl Shift P</kbd>
  </button>
  <span class="spacer pywebview-drag-region" @dblclick="toggleDesktopMaximize"></span>
  <div class="header-actions">
    <button class="icon-btn" @click="toggleInspector" :aria-label="i18n.header.toggleInspector"
            :aria-expanded="inspectorExpanded" aria-controls="inspector-panel"
            :title="i18n.header.toggleInspectorHint">
      <svg class="icon" aria-hidden="true"><use href="#i-panel-right"></use></svg>
    </button>
    <span class="header-divider" aria-hidden="true"></span>
    <button class="icon-btn notification-btn" @click.stop="toggleNotifications" :aria-label="i18n.header.notifications" :title="i18n.header.notifications">
      <svg class="icon" aria-hidden="true"><use href="#i-bell"></use></svg>
      <span class="activity-dot" x-show="hasUnreadNotifications" aria-hidden="true"></span>
    </button>
    <button class="icon-btn" @click="openRecovery" :aria-label="i18n.header.recovery" :title="i18n.header.recovery">
      <svg class="icon" aria-hidden="true"><use href="#i-recovery"></use></svg>
    </button>
    <button class="icon-btn" @click="openShortcuts" :aria-label="i18n.header.shortcuts" :title="i18n.header.shortcuts">
      <svg class="icon" aria-hidden="true"><use href="#i-keyboard"></use></svg>
    </button>
    <button class="icon-btn" @click="toggleSettings" :aria-label="i18n.header.settings" :title="i18n.header.settings">
      <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
    </button>
  </div>
</header>
<div class="window-controls" x-show="desktopAvailable" x-cloak aria-label="窗口控制">
  <button class="window-btn" @click="minimizeDesktop" :title="i18n.header.minimize" :aria-label="i18n.header.minimize">
    <svg class="icon" aria-hidden="true"><use href="#i-window-min"></use></svg>
  </button>
  <button class="window-btn" @click="toggleDesktopMaximize" :title="i18n.header.maximize" :aria-label="i18n.header.maximize">
    <svg class="icon" aria-hidden="true" x-show="desktopRestored"><use href="#i-window-max"></use></svg>
    <svg class="icon" aria-hidden="true" x-show="desktopMaximized"><use href="#i-window-restore"></use></svg>
  </button>
  <button class="window-btn window-close" @click="closeDesktop" :title="i18n.header.closeWindow" :aria-label="i18n.header.closeWindow">
    <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
  </button>
</div>
