<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>CodingAgent</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body x-data="agentApp" :class="bodyClasses">
<a class="skip-link" href="#main">跳到主区</a>
<div id="app-root">
<div id="boot" x-show="bootVisible" x-cloak>
  <div class="login-box">
    <h2>CodingAgent</h2>
    <p x-text="bootText"></p>
  </div>
</div>

<div id="config-error" x-show="configError" x-cloak role="alert">
  <div class="login-box">
    <h2>配置错误</h2>
    <p x-text="configError"></p>
    <p class="note" x-show="configErrorCode" x-text="configErrorCodeText"></p>
    <p class="note">运行时配置不合法；为避免请求发往错误地址，界面已停止加载。</p>
    <button @click="reloadPage">重新加载</button>
  </div>
</div>

<div id="version-error" x-show="versionError" x-cloak role="alert">
  <div class="login-box">
    <h2>版本不兼容</h2>
    <p x-text="versionError"></p>
    <p class="note" x-show="versionErrorCode" x-text="versionErrorCodeText"></p>
    <p class="note">前端与 API 的契约版本不一致；升级到兼容版本后再试。</p>
    <button @click="reloadPage">重新加载</button>
  </div>
</div>

<div id="login" x-show="loginVisible" x-cloak>
  <div class="login-box">
    <h2>CodingAgent</h2>
    <p x-text="loginMessage"></p>
    <input type="text" x-model="loginUsername" autocomplete="username"
           placeholder="用户名" x-show="authLocalVisible">
    <input type="password" x-model="loginPassword" autocomplete="current-password"
           placeholder="密码" x-show="authLocalVisible"
           @keydown.enter.prevent="loginWithPassword">
    <button class="primary" @click="loginWithPassword"
            x-show="authLocalVisible">登录</button>
    <button x-show="authLocalVisible" @click="showPasswordReset"
            x-text="i18n.auth.forgotPassword"></button>
    <div x-show="resetVisible">
      <input type="text" x-model="resetIdentifier" autocomplete="username"
             :placeholder="i18n.auth.resetIdentifier">
      <button @click="requestPasswordReset" x-text="i18n.auth.resetRequest"></button>
      <input type="text" x-model="resetToken" autocomplete="one-time-code"
             :placeholder="i18n.auth.resetToken">
      <input type="password" x-model="resetNewPassword" autocomplete="new-password"
             :placeholder="i18n.auth.resetNewPassword">
      <button class="primary" @click="confirmPasswordReset"
              x-text="i18n.auth.resetConfirm"></button>
      <p class="note" role="status" x-text="resetMessage"></p>
    </div>
    <button @click="startOidcLogin" x-show="authOidcVisible">使用 SSO 登录</button>
    <div x-show="mfaVisible">
      <input type="text" x-model="mfaCode" autocomplete="one-time-code"
             placeholder="动态码或恢复码"
             @keydown.enter.prevent="verifyMfa">
      <button class="primary" @click="verifyMfa">验证并登录</button>
    </div>
    <input type="password" x-model="tokenInput" autocomplete="off"
           placeholder="Bearer token" x-show="authTokenVisible">
    <button @click="saveToken" x-show="authTokenVisible">进入</button>
    <button class="primary" @click="startLogin"
            x-show="authBffVisible">统一登录</button>
  </div>
</div>
