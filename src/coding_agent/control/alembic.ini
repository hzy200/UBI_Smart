# A2 control-plane migration config.
# Alembic reads this file with the system default encoding, so keep it ASCII.
#
# From the repository root:
#   alembic -c src/coding_agent/control/alembic.ini upgrade head
#
# The application sets script_location and sqlalchemy.url explicitly in
# coding_agent.control.migrate, so the current working directory does not
# matter.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =
