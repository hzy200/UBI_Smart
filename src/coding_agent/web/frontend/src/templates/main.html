  <main class="main">
    <div class="main-tabs" role="tablist" aria-label="主区标签">
      <button class="main-tab" role="tab" :class="mainTabClass('chat')"
              :aria-selected="mainTab === 'chat' ? 'true' : 'false'" @click="showChat()">
        <svg class="icon" aria-hidden="true"><use href="#i-chat"></use></svg>
        <span>对话</span>
      </button>
      <button class="main-tab" role="tab" :class="mainTabClass('file')" x-show="fileView.path"
              :aria-selected="mainTab === 'file' ? 'true' : 'false'" @click="showFileTab()">
        <svg class="icon" aria-hidden="true"><use href="#i-files"></use></svg>
        <span class="main-tab-label" x-text="fileView.path"></span>
        <span class="tab-close" role="button" @click.stop="closeFileTab()" title="关闭文件">×</span>
      </button>
      <button class="main-tab" role="tab" :class="mainTabClass('diff')" x-show="diffDisplay"
              :aria-selected="mainTab === 'diff' ? 'true' : 'false'" @click="showDiffTab()">
        <svg class="icon" aria-hidden="true"><use href="#i-git"></use></svg>
        <span>Diff</span>
        <span class="tab-close" role="button" @click.stop="closeDiffTab()" title="关闭 Diff">×</span>
      </button>
      <div class="main-search" x-show="messageSearchOpen" x-cloak>
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input x-ref="messageSearchInput" x-model="messageQuery"
               @input="searchMessages(messageQuery)"
               @keydown.enter.prevent="nextMessageMatch(1)"
               @keydown.escape="closeMessageSearch()"
               placeholder="搜索对话…" aria-label="搜索对话">
        <span class="note" x-text="messageMatchLabel()"></span>
        <button @click="nextMessageMatch(-1)" title="上一个">↑</button>
        <button @click="nextMessageMatch(1)" title="下一个">↓</button>
        <button @click="closeMessageSearch()" title="关闭搜索">×</button>
      </div>
      <span class="main-tab-title" x-show="!messageSearchOpen" x-text="currentSessionTitle()"></span>
      <span class="spacer"></span>
      <span class="main-tab-state" x-show="!messageSearchOpen" x-text="stateText"></span>
      <button class="icon-btn" x-show="!messageSearchOpen" @click="openMessageSearch()"
              title="搜索对话（Ctrl+Shift+F）" aria-label="搜索对话">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
      </button>
      <button class="icon-btn" @click="openCommandPalette()" title="命令面板" aria-label="命令面板">
        <svg class="icon" aria-hidden="true"><use href="#i-command"></use></svg>
      </button>
    </div>

    <section class="editor-view" x-show="mainTab === 'file'" x-cloak>
      <div class="editor-toolbar">
        <span class="editor-path" x-text="fileView.path"></span>
        <span class="note" x-text="fileView._size"></span>
        <span class="note" x-show="fileView._lang" x-text="fileView._lang"></span>
        <span class="spacer"></span>
        <button @click="copyText(fileView.path)">复制路径</button>
        <button x-show="canOpenFileInVscode()" @click="openFileInVscode()">在 VS Code 打开</button>
        <button @click="copyText(fileView._text)">复制内容</button>
        <button @click="closeFileTab()">关闭</button>
      </div>
      <pre class="editor-code"><code x-html="fileView._html"></code></pre>
    </section>

    <section class="editor-view" x-show="mainTab === 'diff'" x-cloak>
      <div class="editor-toolbar">
        <span class="editor-path">Diff</span>
        <span class="note" x-text="diffPath || '本轮改动'"></span>
        <span class="spacer"></span>
        <button x-show="diffTruncated && !diffExpanded" @click="expandDiff()">展开全部</button>
        <button @click="copyText(diffDisplay)">复制</button>
        <button @click="closeDiffTab()">关闭</button>
      </div>
      <div class="diff-view">
        <template x-for="row in diffRows()" :key="row._key">
          <div class="diff-line" :class="row._cls">
            <span class="diff-no" x-text="row._no"></span>
            <span class="diff-text" x-text="row.text"></span>
          </div>
        </template>
      </div>
    </section>

    <div class="main-chat" x-show="mainTab === 'chat'">
    <div class="reasoning" x-show="showReasoning && reasoningBlocks.length" x-cloak>
      <template x-for="(block, index) in reasoningBlocks" :key="index">
        <details class="reasoning-block" :open="index === reasoningBlocks.length - 1">
          <summary>模型思考 <span x-text="block.node"></span></summary>
          <pre x-text="block.text"></pre>
        </details>
      </template>
    </div>
    <div class="transcript" x-ref="transcript" role="log" aria-live="polite"
         aria-label="对话记录" @scroll="onTranscriptScroll($event)">
      <button class="load-older" x-show="hiddenMessageCount() > 0" @click="showOlderMessages()">
        显示更早消息（还有 <span x-text="hiddenMessageCount()"></span> 条）
      </button>
      <template x-for="m in visibleMessages()" :key="m.id">
        <div class="msg" :class="messageClass(m)" :data-message-id="m.id">
          <div class="msg-head">
            <span class="msg-badge"
                  :class="'badge-' + (m.phase || m.role)"
                  x-text="messageLabel(m)"></span>
            <button class="msg-copy" @click="copyTranscriptMessage(m)"
                    title="复制这条消息">复制</button>
            <button class="msg-copy" x-show="m.role === 'user'"
                    @click="editMessage(m)" title="编辑后重新发送">编辑重发</button>
            <button class="msg-copy"
                    x-show="m.role === 'assistant' && m.phase === 'final' && _lastPrompt && !busy"
                    @click="regenerate()" title="重新生成">重新生成</button>
          </div>
          <template x-if="m.kind === 'tool'">
            <div class="inline-tool" :class="m._cls">
              <div class="inline-tool-head">
                <span class="tool-dot"
                      :class="m._cls.includes('tool-ok') ? 'dot-ok'
                        : (m._cls.includes('tool-error') || m._cls.includes('tool-rejected')) ? 'dot-bad'
                        : 'dot-run'"></span>
                <span class="tool-name" x-text="m.name"></span>
                <span class="tool-level" x-text="m.level"></span>
                <span class="tool-meta"
                      x-text="m.duration_ms != null ? `${m.duration_ms}ms`
                        : (m.exit_code != null ? `exit ${m.exit_code}` : '')"></span>
                <span class="tool-state" x-text="m.state"></span>
              </div>
              <div class="inline-tool-cmd" x-show="m.summary"
                   x-text="m.summary"></div>
              <pre class="inline-tool-out" x-show="m.preview"
                   x-text="m.preview"
                   :class="{ 'is-collapsed': !m._expanded && (m.preview || '').length > 800 }"></pre>
              <button class="msg-toggle"
                      x-show="(m.preview || '').length > 800"
                      @click="m._expanded = !m._expanded"
                      x-text="m._expanded ? '收起输出' : '展开输出'"></button>
            </div>
          </template>
          <template x-if="m.kind !== 'tool'">
            <div class="msg-text">
              <div class="msg-body"
                   :class="{ 'msg-collapsed': !m._expanded && isAnswerLong(m) }"
                   x-html="m.html"></div>
              <button class="msg-toggle" x-show="isAnswerLong(m)"
                      @click="m._expanded = !m._expanded"
                      x-text="m._expanded ? '收起全文' : '展开全文'"></button>
            </div>
          </template>
        </div>
      </template>
      <template x-for="c in consents" :key="c.id">
        <div class="consent-card" role="alert">
          <div class="consent-head">
            <span class="consent-title">本机文件访问授权</span>
            <span class="consent-sensitive" x-show="c.sensitive">敏感路径</span>
          </div>
          <div class="consent-row">
            <span>操作</span><span x-text="consentVerbs(c.verbs)"></span>
          </div>
          <div class="consent-row" x-show="c.reason">
            <span>原因</span><span x-text="c.reason"></span>
          </div>
          <div class="consent-scope">
            <template x-for="s in c.scope" :key="s">
              <code x-text="s"></code>
            </template>
          </div>
          <div class="consent-actions">
            <button class="danger" @click="decideConsent(c.id, false)">拒绝</button>
            <button class="primary" @click="decideConsent(c.id, true)">允许本次</button>
          </div>
        </div>
      </template>
      <div class="empty" x-show="messages.length === 0 && consents.length === 0">
        输入任务开始。默认只读：Agent 只能读取文件，不能运行命令或测试。
      </div>
    </div>

    <button class="jump-latest" x-show="showJumpLatest" @click="scrollBottom(true)">
      跳到最新 ↓
    </button>

    <div class="composer" @dragover.prevent @drop.prevent="dropFiles($event)">
      <textarea x-model="prompt" @keydown="onEnter($event)"
                @compositionstart="onCompositionStart()"
                @compositionend="onCompositionEnd()"
                aria-label="任务输入"
                placeholder="输入任务，Enter 发送，Shift+Enter 换行"></textarea>
      <div class="composer-actions">
        <button @click="send()" :disabled="sendDisabled()">发送</button>
        <button @click="steer('pause')" :disabled="!busy">暂停</button>
        <button @click="steer('cancel')" :disabled="!busy && !paused">取消</button>
        <button @click="resumeSteering()" :disabled="!paused">继续</button>
        <button @click="reconnect()" x-show="canReconnect">重连事件流</button>
        <button @click="retry()" x-show="_lastPrompt && !busy">重试上一条</button>
        <button @click="openNewSettings()" :disabled="!busy">追加任务</button>
        <button @click="replan()" :disabled="!busy">重规划</button>
        <label class="upload-label">
          上传文件
          <input type="file" multiple @change="uploadFiles($event)">
        </label>
      </div>
      <div class="upload-list" x-show="uploads.length > 0">
        <template x-for="u in uploads" :key="u.relative_path">
          <span class="upload-chip" :title="u.relative_path">
            <span x-text="u._name"></span>
            <span class="upload-size" x-text="u._size"></span>
            <button class="chip-delete" @click="deleteUpload(u.relative_path)">×</button>
          </span>
        </template>
      </div>
      <div class="note" x-show="uploadQuota" x-text="uploadQuota"></div>
    </div>
    </div>
  </main>

  <div class="splitter splitter-right" x-show="!inspectorCollapsed"
       @pointerdown="startResize('inspector', $event)"
       role="separator" aria-orientation="vertical" aria-label="调整检查器宽度"></div>
