<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>CodingAgent</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body x-data="agentApp" :class="bodyClasses">
<a class="skip-link" href="#main">跳到主区</a>
<div id="app-root">
<div id="boot" x-show="bootVisible" x-cloak>
  <div class="login-box">
    <h2>CodingAgent</h2>
    <p x-text="bootText"></p>
  </div>
</div>

<div id="config-error" x-show="configError" x-cloak role="alert">
  <div class="login-box">
    <h2>配置错误</h2>
    <p x-text="configError"></p>
    <p class="note" x-show="configErrorCode" x-text="configErrorCodeText"></p>
    <p class="note">运行时配置不合法；为避免请求发往错误地址，界面已停止加载。</p>
    <button @click="reloadPage">重新加载</button>
  </div>
</div>

<div id="version-error" x-show="versionError" x-cloak role="alert">
  <div class="login-box">
    <h2>版本不兼容</h2>
    <p x-text="versionError"></p>
    <p class="note" x-show="versionErrorCode" x-text="versionErrorCodeText"></p>
    <p class="note">前端与 API 的契约版本不一致；升级到兼容版本后再试。</p>
    <button @click="reloadPage">重新加载</button>
  </div>
</div>

<div id="login" x-show="loginVisible" x-cloak>
  <div class="login-box">
    <h2>CodingAgent</h2>
    <p x-text="loginMessage"></p>
    <input type="password" x-model="tokenInput" autocomplete="off"
           placeholder="Bearer token" x-show="authTokenVisible">
    <button @click="saveToken" x-show="authTokenVisible">进入</button>
    <button class="primary" @click="startLogin"
            x-show="authBffVisible">统一登录</button>
  </div>
</div>
