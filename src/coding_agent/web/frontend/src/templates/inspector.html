<section class="inspector" id="inspector-panel" x-show="inspectorVisible">
  <div class="inspector-head">
    <div class="tabs" role="tablist" aria-label="检查器标签">
      <button role="tab" :aria-selected="tabFlags.plan"
              :class="tabClasses.plan" data-action="inspector-tab" data-tab="plan" @click="onAction">计划</button>
      <button role="tab" :aria-selected="tabFlags.tools"
              :class="tabClasses.tools" data-action="inspector-tab" data-tab="tools" @click="onAction">工具</button>
      <button role="tab" :aria-selected="tabFlags.timeline"
              :class="tabClasses.timeline" data-action="inspector-tab" data-tab="timeline" @click="onAction">时间线</button>
    </div>
    <button class="icon-btn" @click="toggleInspector" title="收起检查器" aria-label="收起检查器">
      <svg class="icon" aria-hidden="true"><use href="#i-panel-right"></use></svg>
    </button>
  </div>

  <div class="panel" x-show="tabFlags.plan">
    <div class="panel-actions">
      <button @click="compactContext" :disabled="compactDisabled">压缩并分叉</button>
    </div>
    <div class="plan-step" x-show="noPlan">还没有计划</div>
    <template x-for="row in planRows" :key="row.number">
      <div class="plan-step" :class="row._cls">
        <span class="idx" x-text="row.number"></span>
        <span x-text="row.text"></span>
        <span class="kind" x-text="row.kind"></span>
      </div>
    </template>
    <div class="note" x-show="planDegraded">规划失败，已退化为单步执行。</div>
  </div>

  <div class="panel" x-show="tabFlags.tools">
    <div class="panel-actions tool-filters">
      <button :class="toolFilterClasses.all" data-action="tool-filter" data-filter="all" @click="onAction">全部</button>
      <button :class="toolFilterClasses.running" data-action="tool-filter" data-filter="running" @click="onAction">运行中</button>
      <button :class="toolFilterClasses.ok" data-action="tool-filter" data-filter="ok" @click="onAction">成功</button>
      <button :class="toolFilterClasses.error" data-action="tool-filter" data-filter="error" @click="onAction">失败</button>
    </div>
    <input class="tool-search" x-model="toolQuery" placeholder="搜索工具名称或输出…">
    <template x-for="t in filteredToolResults" :key="t.key">
      <div class="tool-card" :class="t._cls">
        <div class="tool-head">
          <span class="tool-name" x-text="t.name"></span>
          <span class="tool-level" x-text="t.level"></span>
          <span class="tool-state" x-text="t.state"></span>
          <button class="tool-copy" x-show="t._hasToolText"
                  data-action="copy-tool-text" :data-key="t.key" @click="onAction">复制</button>
        </div>
        <div class="tool-summary" x-text="t.summary"></div>
        <div class="tool-preview" x-show="t.preview" x-text="t._previewText"></div>
        <div class="output-actions" x-show="t._previewMore">
          <button class="tool-copy" x-show="t._previewMore"
                  data-action="more-tool-preview" :data-key="t.key" @click="onAction"
                  x-text="t._previewMoreLabel"></button>
          <span class="note" x-show="t._previewHint" x-text="t._previewHint"></span>
        </div>
        <details class="tool-detail">
          <summary>详情</summary>
          <pre x-text="t._detail"></pre>
          <button data-action="copy-tool" :data-key="t.key" @click="onAction">复制详情</button>
        </details>
      </div>
    </template>
    <div class="empty" x-show="noTools">没有匹配的工具调用</div>
  </div>

  <div class="panel" x-show="tabFlags.timeline">
    <div class="timeline">
      <template x-for="item in timeline" :key="item.id">
        <div class="timeline-item" :class="item._cls">
          <span class="timeline-dot"></span>
          <div class="timeline-body">
            <div class="timeline-line">
              <span class="timeline-title" x-text="item.title"></span>
              <span class="timeline-time" x-text="item.time"></span>
            </div>
            <div class="timeline-detail" x-show="item.detail" x-text="item.detail"></div>
          </div>
        </div>
      </template>
      <div class="empty" x-show="noTimeline">当前运行还没有时间线记录</div>
    </div>
  </div>
</section>
