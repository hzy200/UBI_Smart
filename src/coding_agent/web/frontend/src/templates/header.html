<header x-show="ready" x-cloak>
  <button class="icon-btn" @click="toggleSidebar()" aria-label="切换侧栏" title="切换侧栏（Ctrl+B）">
    <svg class="icon" aria-hidden="true"><use href="#i-panel-left"></use></svg>
  </button>
  <span class="name">CodingAgent</span>
  <button class="command-trigger" @click="openCommandPalette()" aria-label="搜索或运行命令">
    <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
    <span>搜索或运行命令</span>
    <kbd>Ctrl Shift P</kbd>
  </button>
  <span class="meta workspace" x-text="workspaceLabel()"></span>
  <span class="spacer"></span>
  <button class="icon-btn" @click="toggleInspector()" aria-label="切换检查器" title="切换检查器（Ctrl+J）">
    <svg class="icon" aria-hidden="true"><use href="#i-panel-right"></use></svg>
  </button>
  <button class="icon-btn" @click="openRecovery()" aria-label="打开恢复中心" title="恢复中心">
    <svg class="icon" aria-hidden="true"><use href="#i-recovery"></use></svg>
  </button>
  <button class="icon-btn" @click="shortcutsOpen = true" aria-label="查看快捷键" title="快捷键">
    <svg class="icon" aria-hidden="true"><use href="#i-keyboard"></use></svg>
  </button>
  <button class="icon-btn" @click="toggleSettings()" aria-label="打开设置" title="设置">
    <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
  </button>
</header>
