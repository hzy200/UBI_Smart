[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ubismart"
dynamic = ["version"]
description = "LangGraph-based terminal-native coding agent with WSL2 sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.100",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # A2 控制面 schema/store（SQLite 与 MySQL 共用 SQLAlchemy 模型）
    "sqlalchemy>=2.0",
    # A2L 策略验签与设备证明
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    # mTLS 协议测试用真实自签证书生成
    "cryptography>=42",
    # 集成测试全是 wsl.exe 进程启动，串行跑要十分钟；并行后 1 分钟内
    "pytest-xdist>=3.6",
    "pytest-cov>=5.0",
    # 安全/终端等新边界先开 strict；存量模块渐进迁移
    "mypy>=1.10",
    # tracing 测试用 InMemorySpanExporter；生产采集端在 otel extra
    "opentelemetry-sdk>=1.25",
]
ui = [
    "textual>=0.80",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
desktop = [
    "pywebview>=5.0",
]
secrets = [
    "keyring>=24",
]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
build = [
    "pyinstaller>=6",
]
# A2 控制面：MySQL 驱动与后续迁移工具（SQLAlchemy 已是主依赖）
db = [
    "pymysql>=1.1",
    "alembic>=1.13",
]
# 多实例 SSE 共享事件传输
events = [
    "redis>=5",
]
# 浏览器 Web Push（VAPID + payload 加密）；未安装时自动降级为站内通知
webpush = [
    "pywebpush>=2.0",
]
embeddings = [
    "fastembed>=0.3",
]
# 文档读取：宿主侧二进制解析，不进入 WSL 沙箱。
documents = [
    "pypdf>=5",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-pptx>=1.0",
    "Pillow>=10",
    "defusedxml>=0.7",
    "pypdfium2>=4",
]
# 报告导出：Markdown/DOCX/PDF；PDF 运行期查找系统 CJK 字体，不附带字体文件。
report = [
    "python-docx>=1.1",
    "markdown-it-py>=3",
    "reportlab>=4",
]

[project.scripts]
agent = "ubismart.cli.app:main"
ubismart-server = "ubismart.servers.server:main"
ubismart-desktop = "ubismart.desktop.launcher:main"
ubismart-agent = "ubismart.servers.agent_server:main"
ubismart-control = "ubismart.servers.control_server:main"
ubismart-host-device = "ubismart.host_broker.devices:main"
ubismart-host-policy = "ubismart.host_broker.policy_doc:main"
# 兼容旧命令名：保留一个发布周期，便于现有脚本/服务平滑迁移。
coding-agent-server = "ubismart.servers.server:main"
coding-agent-desktop = "ubismart.desktop.launcher:main"
coding-agent-agent = "ubismart.servers.agent_server:main"
coding-agent-control = "ubismart.servers.control_server:main"
coding-agent-host-device = "ubismart.host_broker.devices:main"
coding-agent-host-policy = "ubismart.host_broker.policy_doc:main"

[tool.hatch.version]
# 单一版本源：`ubismart.__version__`；打包/前端/发布脚本都从这里对齐。
path = "src/ubismart/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ubismart"]

[tool.pytest.ini_options]
# "." 让 `from tests.eval...` 这类助手导入在 CI 的 console-script 入口下也成立
# （`python -m pytest` 会把 cwd 放进 sys.path，`pytest` 不会 —— 两边必须一致）。
pythonpath = ["src", "."]
testpaths = ["tests"]
# 默认并行：集成测试的开销几乎全在 wsl.exe 进程启动上（每次约 0.3s），
# 串行跑一遍要十分钟，且完全受 I/O 限制，并行几乎线性加速。
addopts = "-q -n auto --dist loadfile"
markers = [
    "wsl: 需要本机可用的 WSL2 发行版",
    "llm: 需要 DEEPSEEK_API_KEY",
    "wsl_env: 显式探测宿主 WSL 环境（如 doctor），允许真实执行沙箱命令",
    "execution: 真实 WSL/Linux 执行后端契约测试，允许启动沙箱命令",
    "host: 需要 Windows 真机 A2L 宿主能力代理的测试",
    "mysql: 需要 AGENT_TEST_MYSQL_URL 指向独立测试库",
    "smoke: 系统冒烟，无 WSL/LLM 依赖，提交/发版前快速确认主链路可用",
    "regression: 承重不变量与历史回归集，失败即视为回归而不是新需求",
    "agent_e2e: 智能体级端到端验收（真实 WSL + 真实模型，消耗额度）",
    "system_e2e: A2/A3/A4 系统级端到端验收（专用 WSL 发行版 + 真实模型，本地手动执行）",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "src/ubismart/security",
  "src/ubismart/identity/access.py",
  "src/ubismart/protocol/terminal_text.py",
]
# 存量模块尚未全量注解；先只对安全/终端边界做 strict 基线，逐步扩大。
follow_imports = "normal"

[tool.coverage.run]
source = ["src/ubismart"]

[tool.coverage.report]
# 把没被覆盖的行号打出来：沙箱层与能力层的缺口必须**看得见**，而不是藏在总数里
show_missing = true
# 门槛按 **CI 实际执行的那部分** 定：GitHub 托管 runner 是 Linux 容器、没有 WSL2，
# 因此 `-m "not wsl and not llm"` 的子集在 Windows 上实测 82.68%（不含 wsl 集成测试）。
# 取 76 而不是贴着 82.68：这些数字是在 Windows 上量的，CI 跑在 Linux，
# 平台相关的分支（路径守卫、wsl 输出解码）会让数字小幅漂移，贴太近会变成随机红灯。
# 本机跑全量（含 `-m wsl`）为 90.49%，远高于此值。
# 之所以只做全局门槛而不按模块设：沙箱层的低覆盖（CI 子集下 tools/files.py 29%、
# snapshots.py 43%、fs.py 50%）要的是**可见**与后续改进，不是靠 omit 抹平。
fail_under = 76

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# `select` 里的规则必须 **0 违规**（CI 的 `ruff check src tests` 会红）。
select = ["E", "F", "I", "UP", "B"]

# ---------------- 被预算跟踪、但故意不阻断的规则 ----------------
# S = bandit（安全）· C90 = 圈复杂度 · TRY = 异常路径 · RET = 返回值 ·
# ASYNC = 事件循环阻塞 · A = 内建名遮蔽 · T20 = print。
#
# 它们存量几百条，一次修不完，所以**不进 `select`** —— 进了 select 就会让 CI
# 立刻变红，然后有人把它 ignore 掉、闸门就此消失。改由
# `scripts/check_lint_budget.py` 计数并卡住"不许变多"：数字只降不升。
# 抬预算等于关闸门，不要那么做。
#
# 本地看具体哪一行：`ruff check --select S,C90,TRY,RET,ASYNC,A,T20 src`
# （`scripts/check_lint_budget.py` 里的 `SELECT` 常量必须与这个列表一致；
#  不能在 `[tool.ruff.lint]` 下加自定义键，ruff 会拒绝解析。）

# 每条都要有理由；没有理由的 ignore 就是关掉安全闸门。
ignore = [
    # S101 assert：测试与产品代码都用 assert 表达内部不变量。项目不以 `python -O`
    # 运行任何受支持的入口，因此不存在"断言被编译掉"的绕过面。
    "S101",
    # S110/S112 try-except-pass/continue：绝大多数是"best-effort 清理"路径。
    # 它们确实会吞掉异常 —— 关键路径（审计、计量、配额、快照留底）见 P1-5；
    # 其余靠预算棘轮收敛，不要新增。
    "S110",
    "S112",
    # S603/S607 subprocess：本产品的核心就是宿主与沙箱的进程启动（wsl.exe、
    # git、工具链）。调用全部走 argv 列表、不经 shell；不由 argv 表达的部分
    # 由 `sandbox/policy.py` 与 `execution/host_ops.py` 的 kind 白名单守住。
    "S603",
    "S607",
    # S324 hashlib：命中的都是缓存键、短摘要与文件名（sha1），不用于口令、
    # 签名或令牌。密码学用途一律 sha256/hmac（`control/credentials.py`）。
    "S324",
    # S311 random：只用于退避抖动与非安全用途；令牌与 id 走 `uuid4` / `secrets`。
    "S311",
    # S108 /tmp：沙箱侧的 Linux 路径是刻意的（工作区之外、不进用户改动）。
    "S108",
    # S310 urlopen：命中处均为 http(s) 且目标已过 `security/netguard.py`；
    # 新增外连必须同样过守卫。
    "S310",
    # TRY003 raise-long-args：415 处，全是 `raise X("中文提示")`。这条规则要求
    # 自定义异常类再 raise 无参构造，与本项目"错误信息就是给人看的"的写法冲突，
    # 而且自定义异常本身不带来任何安全收益。整条 ignore，不进预算。
    "TRY003",
    # ASYNC240 async 里的 `os.path`/`Path` 元数据调用：命中的都是
    # `exists()` / `is_dir()` / `stat()`，单次亚毫秒级路径查询。为它们逐个包
    # `asyncio.to_thread` 只会增加延迟与噪音。**真正的**阻塞（async 里的
    # `open()` = ASYNC230、以及循环里的同步写）不在此列，走预算。
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
# textual 是可选依赖：必须先 importorskip，再导入它，否则缺 ui extras 时
# 会以 collection error 而非 skip 收场。E402 在这里是有意为之。
"tests/tui/test_tui_app.py" = ["E402"]
# S104/S105/S106/S107 硬编码口令与全网卡绑：测试里的 `token="tok"`、`sk-...`、
# `--host 0.0.0.0` 都是**夹具字面量**——它们正是在断言脱敏、验签与"非 loopback
# 必须要求 token"这些行为本身。真口令只从环境变量与密钥环来，不进仓库。
"tests/**" = ["S104", "S105", "S106", "S107"]
# 首次启动向导的 HTML 内嵌在 Python 字符串里，长行不可避免。
"src/ubismart/desktop/setup.py" = ["E501"]
# 任务种子/测试是嵌在字符串里的 Python 源码，长行不可避免。
"tests/eval/tasks_full.py" = ["E501"]
# T201 print：这些是 **CLI 入口与命令行工具** —— stdout 就是它们的产品形态
# （`agent migrate` 要打印迁移结果，`host_broker --policy-doc` 要产出文档）。
# 服务/守护进程里的 print 不在豁免之列，走预算（容器化后日志采集会分裂）。
"src/ubismart/cli/**" = ["T201"]
"src/ubismart/tui/**" = ["T201"]
"src/ubismart/host_broker/__main__.py" = ["T201"]
"src/ubismart/host_broker/policy_doc.py" = ["T201"]
"src/ubismart/host_broker/devices.py" = ["T201"]
"src/ubismart/control/migrate.py" = ["T201"]
"src/ubismart/servers/control_server.py" = ["T201"]
"src/ubismart/servers/agent_server.py" = ["T201"]
# 启动握手那行 JSON（event: ubismart_*）是给 supervisor/launcher **解析**的，
# 不是日志 —— 换 logging 会把协议改掉。
"src/ubismart/servers/server.py" = ["T201"]

[tool.ruff.lint.mccabe]
# 10 是 ruff 默认；这里不动它，让存量如实显形，靠预算棘轮收敛，
# 而不是把阈值抬高把问题藏起来。
max-complexity = 10
