name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    # 前端独立发版：构建、类型检查、单测、E2E，并产出可校验的发布包。
    # 后端 job 不消费这个 artifact，两者可以独立上线/回滚。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ubismart/web/frontend/package-lock.json
      - name: 安装前端依赖
        # 前端单测依赖 jsdom，构建依赖 esbuild；锁文件已入库，用 ci 保证可复现。
        working-directory: src/ubismart/web/frontend
        env:
          # E2E 使用 runner 自带的 Chrome（channel: chrome），不下载浏览器。
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: 前端构建
        # static/app.js 是生成物：源码改了但没重建会让 CI 红。
        run: |
          python scripts/build_frontend.py
          git diff --exit-code -- \
            src/ubismart/web/static/app.js \
            src/ubismart/web/static/index.html \
            src/ubismart/web/static/style.css \
            src/ubismart/web/static/admin
      - name: 前端类型检查
        working-directory: src/ubismart/web/frontend
        run: npx tsc --noEmit
      - name: 前端单元测试
        # test.mjs / test-dom.mjs 依赖 cwd 解析 tests/*.test.ts，必须在
        # frontend 目录下执行；从仓库根直接跑会报 Could not resolve。
        working-directory: src/ubismart/web/frontend
        run: npm test
      - name: 前端真实浏览器 E2E
        working-directory: src/ubismart/web/frontend
        run: npx playwright test
      - name: 生成独立发布包
        run: python scripts/build_frontend_release.py --skip-build
      - name: 校验发布包
        run: |
          version=$(sed -n "s/.*FRONTEND_VERSION = '\\([^']*\\)'.*/\\1/p" src/ubismart/web/frontend/src/version.ts)
          python scripts/check_frontend_release.py --dir "dist/frontend/$version"
      - name: 上传前端独立产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: dist/frontend
          retention-days: 14

  backend:
    # 后端不依赖前端构建产物：包内 static/ 是回退快照，测试只读源码树。
    # GitHub 托管 runner 没有 WSL，因此只跑不依赖沙箱与 API Key 的用例。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（开发 + 界面 + 控制面数据库依赖）
        run: pip install -e ".[dev,ui,web,db,documents,report]"
      - name: 依赖锁定新鲜度
        # `pyproject.toml` 改了而 `uv.lock` 没重生成 → 红灯。
        # 只做**校验**、不建环境：本仓库的开发环境是 conda + pip，不是 uv。
        # 生产部署用 `uv sync --frozen`（或 `uv export` 出带哈希的
        # requirements.txt 再 `pip install --require-hashes`），避免
        # "装到的不是锁定的那一版"。
        uses: astral-sh/setup-uv@v5
      - name: 校验 uv.lock
        run: uv lock --check
      - name: Lint
        # 阻断式规则（E/F/I/UP/B）必须 0 违规。安全与质量类规则
        # （S/C90/TRY/RET/ASYNC/A）刻意**不进 select**，由下面的棘轮计数。
        run: ruff check src tests
      - name: 质量 lint 预算（棘轮）
        # 存量 120 处一次修不完，但闸门必须存在：`try-except-pass` 之类只允许
        # 减少，不允许新增。修完一处就用 `--update` 把预算降下来。
        run: python scripts/check_lint_budget.py
      - name: 类型检查（安全/终端边界 strict）
        run: mypy
      - name: 性能冒烟（策略/终端/限流热路径）
        # 阈值很宽松，只挡数量级退化；慢 runner 可用 --factor 进一步放宽。
        run: python scripts/perf_smoke.py
      - name: 文档管线压测门槛
        # 小规模样例（20 页 × 2 份）；阈值按页数放宽并再乘 factor=2，
        # 只挡数量级退化，不作为容量基准。
        run: python scripts/bench_documents.py --check --pages 20 --docs 2 --factor 2
      - name: SSE 并发冒烟（20 路 × 200 token）
        # 同进程 A3 + 假 runtime；不是容量基准，只挡并发流互相拖死。
        run: python scripts/sse_load_smoke.py
      - name: 版本一致性
        # pyproject 从 `ubismart.__version__` 动态取版本；前端两份文件
        # 无法 import Python，因此在 CI 里显式比对。
        run: python scripts/check_version.py
      - name: 密钥扫描（gitleaks）
        # 只扫本次改动引入的提交区间；全量历史扫描在 security.yml 里定时跑。
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: 测试 + 覆盖率
        # 门槛（fail_under=76）与说明在 pyproject.toml 的 [tool.coverage.report]。
        # term-missing 是刻意的：沙箱层与能力层的缺口必须留在日志里能看见。
        run: |
          pytest -m "not wsl and not wsl_env and not llm" \
            --cov --cov-report=term-missing \
            --cov-report=json:coverage.json
      - name: 承重模块覆盖率棘轮
        # 全局 fail_under 掩盖不了安全模块；每个模块有独立下限，
        # 数字只许上升（scripts/coverage_budget.json）。
        run: python scripts/check_module_coverage.py --json coverage.json
      - name: 指标快照漂移
        # docs/METRICS.md + docs/metrics.json 由覆盖率与 collect-only 生成；
        # 文件过期（超出平台容差）就红，不再靠手抄数字。
        run: python scripts/snapshot_metrics.py --coverage coverage.json --collect --check
      - name: 执行后端契约（Linux local）
        # WSL 契约在 Windows 本地用 `pytest -m wsl` 跑；这里验证 Linux 本地后端。
        run: pytest -m execution -q
      - name: Phase D 故障演练
        # 启动本机 loopback A2/A3；覆盖握手、崩溃恢复、DB 降级、版本不匹配、
        # 迁移失败。不调用 LLM，不依赖 WSL 或 MySQL 服务。
        run: python scripts/phase_d_smoke.py --timeout 60
      - name: Phase F 迁移/回滚演练（SQLite）
        # 覆盖 upgrade → 备份 → downgrade base → upgrade → 恢复。
        run: python scripts/phase_f_drill.py
      - name: 显式化沙箱层缺口
        # 没有这一步，"CI 全绿" 很容易被读成 "沙箱层也没问题" —— 恰恰相反：
        # 执行真实命令的那一层在 Linux CI 里**一行都没跑**，它的低覆盖就写在
        # 上面覆盖率报告的 Missing 列里（tools/files.py、sandbox/snapshots.py…）。
        # 用 ::warning:: 让它成为 GitHub 界面上的可见标注，而不是埋在日志里。
        #
        # 真正的门禁在 `.github/workflows/sandbox.yml`：它跑在带 WSL2 的
        # self-hosted runner 上，并对沙箱层单设覆盖率下限；必须在分支保护里
        # 把它设为 required check。
        run: |
          skipped=$(pytest -m wsl --collect-only -q 2>/dev/null | tail -1 || true)
          echo "::warning::Linux CI 没有 WSL2，沙箱层用例未执行（$skipped）。仅快反馈用例通过 ≠ 沙箱层可用；沙箱层门禁见 Sandbox 工作流。"
          echo "被跳过的沙箱层用例：$skipped"

  backend-py311:
    # 开发机最低版本是 3.11；主 backend 用 3.12 跑覆盖率与棘轮，
    # 这里保证最低受支持版本不会被悄悄写坏。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装（开发 + 界面 + 控制面数据库依赖）
        run: pip install -e ".[dev,ui,web,db,documents,report]"
      - name: Python 3.11 快反馈
        run: pytest -m "not wsl and not wsl_env and not llm" -q

  windows:
    # Windows 专属路径：路径守卫、A2L host broker、desktop 启动链。
    # 这些在 Linux runner 上要么 skip，要么走不到；单独一条 job 才有意义。
    runs-on: windows-latest
    env:
      # runner 控制台默认 cp1252；脚本里的中文提示会让子进程
      # UnicodeEncodeError，直接以 UTF-8 运行。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（开发 + 界面 + 控制面依赖）
        # tzdata：Windows 没有系统 zoneinfo 数据库，eval 的 DST 用例需要它。
        run: pip install -e ".[dev,ui,web,db,documents,report]" tzdata
      - name: Windows 快反馈
        # 默认 addopts 是 `-n auto --dist loadfile`；Windows runner 上同样并行。
        run: pytest -m "not wsl and not wsl_env and not llm" -q

  installer:
    # 安装包脚本的**编译演练**：守住"还能编过 + 版本注入没坏"。
    #
    # 不产出可发布包 —— 真包需要 WSL rootfs（build_wsl_distro.py 要跑 apt）
    # 与签名证书，只能在装有 WSL2 的 Windows 机器上做（docs/PHASE2.md）。
    # 但版本写死、卸载删用户数据、引用路径改名这三类问题，静态就能拦。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 创建构建产物 stub（供静态校验）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\UBISmart | Out-Null
          Set-Content -Path dist\UBISmart\UBISmart.exe -Value "stub"
      - name: 静态校验（版本单一源 / 免提权 / 卸载保留数据 / 引用路径）
        run: python scripts/check_installer.py --check
      - name: 安装 Inno Setup 6
        run: choco install innosetup --yes --no-progress
      - name: 编译演练（stub 输入）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\UBISmart | Out-Null
          Set-Content -Path dist\UBISmart\UBISmart.exe -Value "stub"
          New-Item -ItemType Directory -Force -Path packaging\vendor | Out-Null
          Set-Content -Path packaging\vendor\MicrosoftEdgeWebView2Setup.exe -Value "stub"
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe 未找到" }
          & $iscc "/DAppVersion=9.9.9-ci" "packaging\installer\UBISmart.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }
          if (-not (Test-Path dist\UBISmart-Setup.exe)) {
            throw "没有产出 dist\UBISmart-Setup.exe"
          }
          Write-Host "编译演练通过：$((Get-Item dist\UBISmart-Setup.exe).Length) 字节"
      - name: 上传演练产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-stub
          path: dist/UBISmart-Setup.exe
          retention-days: 7
          if-no-files-found: warn

  mysql:
    # 控制面 MySQL 契约：迁移、账号/密钥、配额、用量、备份恢复。
    # 默认被 skip 的 `-m mysql` 必须在真实实例上跑一次。
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: coding_agent_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（开发 + 界面 + 控制面数据库依赖）
        # `pytest -m mysql` 仍会导入全部测试模块；只装 dev+db 会因缺少
        # fastapi 等在收集阶段就报错。
        run: pip install -e ".[dev,ui,web,db,documents,report]"
      - name: 安装 MySQL 客户端
        # 备份/恢复用例直接调用 mysqldump/mysql，service container 只提供服务端。
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: MySQL 契约
        env:
          AGENT_TEST_MYSQL_URL: mysql+pymysql://root:root@127.0.0.1:3306/coding_agent_test?charset=utf8mb4
        run: pytest -m mysql -q
