name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # GitHub 托管 runner 没有 WSL，因此只跑不依赖沙箱与 API Key 的用例。
    # 需要真实 WSL 的集成测试在本地用 `pytest -m wsl` 跑。
    # 测试套件覆盖了 TUI（textual）与 Web（fastapi），所以要装齐 ui / web。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（开发 + 界面 + 控制面数据库依赖）
        run: pip install -e ".[dev,ui,web,db]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/coding_agent/web/frontend/package-lock.json
      - name: 安装前端依赖
        # 前端单测依赖 jsdom，构建依赖 esbuild；锁文件已入库，用 ci 保证可复现。
        working-directory: src/coding_agent/web/frontend
        run: npm ci
      - name: Lint
        run: ruff check src tests
      - name: 前端构建
        # static/app.js 是生成物：源码改了但没重建会让 CI 红。
        run: |
          python scripts/build_frontend.py
          git diff --exit-code -- src/coding_agent/web/static/app.js
      - name: 前端类型检查
        # 用 npm ci 装好的本地 tsc，避免与运行时测试使用两套 TypeScript 版本。
        working-directory: src/coding_agent/web/frontend
        run: npx tsc --noEmit
      - name: 前端单元测试
        # test.mjs / test-dom.mjs 依赖 cwd 解析 tests/*.test.ts，必须在
        # frontend 目录下执行；从仓库根直接跑会报 Could not resolve。
        working-directory: src/coding_agent/web/frontend
        run: npm test
      - name: 上传前端独立产物
        # 独立静态站可直接取这个 artifact；API 托管首页仍保留一个版本作回退。
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: |
            src/coding_agent/web/static/app.js
            src/coding_agent/web/static/index.html
            src/coding_agent/web/static/style.css
            src/coding_agent/web/static/manifest.webmanifest
            src/coding_agent/web/static/icon.svg
            src/coding_agent/web/static/sw.js
            src/coding_agent/web/static/vendor
          retention-days: 14
      - name: 测试 + 覆盖率
        # 门槛（fail_under=76）与说明在 pyproject.toml 的 [tool.coverage.report]。
        # term-missing 是刻意的：沙箱层与能力层的缺口必须留在日志里能看见。
        run: pytest -m "not wsl and not llm" --cov --cov-report=term-missing
      - name: 执行后端契约（Linux local）
        # WSL 契约在 Windows 本地用 `pytest -m wsl` 跑；这里验证 Linux 本地后端。
        run: pytest -m execution -q
      - name: Phase D 故障演练
        # 启动本机 loopback A2/A3；覆盖握手、崩溃恢复、DB 降级、版本不匹配、
        # 迁移失败。不调用 LLM，不依赖 WSL 或 MySQL 服务。
        run: python scripts/phase_d_smoke.py --timeout 60
      - name: Phase F 迁移/回滚演练（SQLite）
        # 覆盖 upgrade → 备份 → downgrade base → upgrade → 恢复。
        run: python scripts/phase_f_drill.py
      - name: 显式化沙箱层缺口
        # 没有这一步，"CI 全绿" 很容易被读成 "沙箱层也没问题" —— 恰恰相反：
        # 执行真实命令的那一层在 CI 里**一行都没跑**，它的低覆盖就写在上面
        # 覆盖率报告的 Missing 列里（tools/files.py、sandbox/snapshots.py…）。
        # 用 ::warning:: 让它成为 GitHub 界面上的可见标注，而不是埋在日志里。
        # 这一步是**信息性**的：它绝不能因为收集本身出问题就把构建弄红 ——
        # 真正该红的是上面的覆盖率门槛。
        run: |
          skipped=$(pytest -m wsl --collect-only -q 2>/dev/null | tail -1 || true)
          echo "::warning::CI 是 Linux runner、没有 WSL2，沙箱层用例未执行（$skipped）。仅快反馈用例通过 ≠ 沙箱层可用。"
          echo "被跳过的沙箱层用例：$skipped"
