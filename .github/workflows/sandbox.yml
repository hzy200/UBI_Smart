name: Sandbox

# 沙箱层门禁：执行**真实 WSL2 命令**的那一层（路径守卫、写前快照、命令分级、
# 文件写工具）。GitHub 托管 runner 没有 WSL2，这一层在 ci.yml 里一行都跑不到，
# 它的覆盖率被全局数字稀释 —— 所以单独开一条跑在自建 runner 上的流水线。
#
# 前置条件：注册一个 Windows + WSL2 的 self-hosted runner（label:
# `self-hosted` / `Windows` / `X64`），并装好项目要求的发行版。
# 没有注册 runner 时这个 job 会一直排队 —— 这不是本文件的 bug，
# 见 docs/CI.md 第「沙箱层」节。
on:
  push:
    branches: [main]
  # PR 也要过沙箱门禁；没有自托管 runner 时它会排队，不能替代 ci.yml。
  pull_request:
  schedule:
    # 每天 UTC 04:00（北京时间 12:00）
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  wsl:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 预检 WSL 与发行版
        # runner 存在但 WSL 被关掉时，直接在这一步失败，而不是把后面的
        # 测试变成一堆难以归因的 timeout。
        run: python scripts/check_sandbox_gate.py --local
      - name: 安装（开发 + 界面 + 控制面数据库依赖）
        run: pip install -e ".[dev,ui,web,db]"
      - name: 沙箱层全量（真实 WSL，不调用模型）
        env:
          # 专用发行版；没有就用 runner 的默认发行版。
          AGENT_WSL_DISTRO: CodingAgent
        run: >
          pytest -m "not llm"
          --cov --cov-report=term-missing --cov-report=json:coverage.json
      - name: 沙箱层覆盖率门槛
        # 只在真的执行过沙箱层的机器上判定才有意义，所以这条不进 ci.yml。
        run: python scripts/check_layer_coverage.py --json coverage.json
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-coverage
          path: coverage.json
          retention-days: 14
