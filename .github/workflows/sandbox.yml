name: Sandbox

# 沙箱层门禁：执行**真实 WSL2 命令**的那一层（路径守卫、写前快照、命令分级、
# 文件写工具）。GitHub 托管 runner 没有 WSL2，这一层在 ci.yml 里一行都跑不到，
# 它的覆盖率被全局数字稀释 —— 所以单独开一条跑在自建 runner 上的流水线。
#
# runner 约定：一个带 WSL2 与项目发行版的机器，注册时打自定义 label `wsl`
# （`./config.cmd --labels wsl`）。`llm.yml` 的 eval job 用的是同一个 label。
# preflight 探测用仓库 secret `RUNNER_ADMIN_TOKEN`（PAT，repo 权限）；
# GITHUB_TOKEN 没有列出 self-hosted runner 的权限。
#
# 没注册 runner 时**不会排队**：preflight 先探测一次在线 runner，没有就明确
# 跳过并打 warning。排队 24 小时后被取消不是"可见化"，只是把 PR 卡住 ——
# 跳过 + 摘要里写明"这不等于通过"才是。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每天 UTC 04:00（北京时间 12:00）
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  # 探测是否存在带 `wsl` label 的在线 runner。
  # 失败方向是安全的：查不到（无权限/网络错误）一律按"没就绪"处理，
  # 只会少跑、不会把没跑的当成通过。
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: 探测 self-hosted WSL runner
        id: check
        env:
          # GITHUB_TOKEN 无法列出 self-hosted runner（需要 Administration: read）；
          # 仓库 secret 由一个具备 repo 权限的 PAT 提供，仅用于这次只读探测。
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          set -u
          runners="$(gh api "repos/${{ github.repository }}/actions/runners" \
            --paginate \
            --jq '.runners[] | select(.status=="online") | .name + "\t" + ([.labels[].name] | join(","))' \
            2>/dev/null || true)"
          printf '%s\n' "$runners" | sed '/^$/d; s/^/runner: /'

          if printf '%s\n' "$runners" | grep -qi 'wsl'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "### ⚠️ 沙箱层门禁未执行"
            echo ""
            echo '没有发现带 `wsl` label 的在线 self-hosted runner，'
            echo "本轮**跳过**真实 WSL 覆盖（路径守卫 / 写前快照 / 命令分级 / 文件写工具）。"
            echo ""
            echo "**跳过不等于通过。** 注册方法见 \`docs/ENVIRONMENT.md\` 的"
            echo "「注册 WSL 门禁 runner」一节。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::未找到在线 wsl runner，沙箱层门禁被跳过（不等于通过）"

  wsl:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.ready == 'true'
    runs-on: [self-hosted, wsl]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 预检 WSL 与发行版
        # runner 存在但 WSL 被关掉时，直接在这一步失败，而不是把后面的
        # 测试变成一堆难以归因的 timeout。
        run: python scripts/check_sandbox_gate.py --local
      - name: 安装（开发 + 界面 + 控制面数据库依赖）
        run: pip install -e ".[dev,ui,web,db,documents,report]"
      - name: 沙箱层全量（真实 WSL，不调用模型）
        env:
          # 专用发行版；没有就用 runner 的默认发行版。
          AGENT_WSL_DISTRO: CodingAgent
        run: >
          pytest -m "not llm"
          --cov --cov-report=term-missing --cov-report=json:coverage.json
      - name: 沙箱层覆盖率门槛
        # 只在真的执行过沙箱层的机器上判定才有意义，所以这条不进 ci.yml。
        run: python scripts/check_layer_coverage.py --json coverage.json
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-coverage
          path: coverage.json
          retention-days: 14

  # 汇总门禁：分支保护只 required 这一个 check。
  # 无 runner（preflight 跳过）或 wsl 失败时它都会红 —— 跳过不再等于通过。
  # 确实不需要沙箱层的改动，可显式设置仓库变量 WSL_GATE_ALLOW_SKIP=true。
  gate:
    name: sandbox-gate
    needs: [preflight, wsl]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 判定沙箱层门禁
        env:
          READY: ${{ needs.preflight.outputs.ready }}
          WSL_RESULT: ${{ needs.wsl.result }}
          ALLOW_SKIP: ${{ vars.WSL_GATE_ALLOW_SKIP }}
        run: |
          if [ "$READY" != "true" ]; then
            if [ "$ALLOW_SKIP" = "true" ]; then
              echo "::warning::WSL_GATE_ALLOW_SKIP=true，本轮跳过沙箱层门禁（不等于通过）"
              exit 0
            fi
            echo "::error::沙箱层门禁未执行：没有在线 wsl runner。跳过不等于通过。"
            exit 1
          fi
          if [ "$WSL_RESULT" != "success" ]; then
            echo "::error::沙箱层门禁失败：wsl job result=$WSL_RESULT"
            exit 1
          fi
          echo "沙箱层门禁通过"
