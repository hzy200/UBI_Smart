  - id: TD-006
    title: 常规短任务评测套件已饱和（default/hard/real/real_advanced/blind 均 100%）
    where: tests/eval/
    why_now: 这些尺子对当前模型没有区分度，继续用它们做 A/B 只会得到 0pp；
      唯一未饱和档 long 任务少、spread 20pp，结论难超噪声
    debt_type: 度量失效
    severity: medium
    workaround: 能力结论改用 long；新任务集按隐藏需求 + 长程多步 + 失败验证成本
      设计，并满足任务数 ≥20、repeat 3、spread <10pp
    owner: 评测维护者
    due: 下次要量化任何改动之前
    added_2026-10-28: |
      `tests/eval` **不在 PR 门禁里**（`pytest -m "not wsl and not wsl_env and not llm"` 选不中它）。
      副作用是：套件什么时候饱和的没人知道，得等下次想量化改动才发现尺子已经废了。
      建议给它一条定时的独立流水线（跑 `-m eval` 之类），失败/饱和都出结论，
      而不是靠人记得去跑。
    added_2026-10-29: |
      流水线与"读结果"都补上了：
      - `.github/workflows/llm.yml` 的 `llm-eval` job 增加定时触发（每周一随
        `llm-tests` 一起跑），由仓库变量 `WSL_RUNNER_READY` 控制 —— runner 没注册
        时 job 会一直排队，那比不跑更糟，所以默认关闭。
      - `scripts/eval_gate.py` 把 JSON 读成结论：饱和只警告（尺子失效不是代码坏了）、
        通过率下降超过阈值才失败、`comparable=false` 一律不下结论。结果写进
        `$GITHUB_STEP_SUMMARY`，不会静默。
      - 口径与用法写进 `tests/eval/README.md`「读结果」一节，判定逻辑由
        `tests/unit/test_eval_gate.py` 8 条用例钉住。
      **仍未偿还的部分**：任务集本身还是饱和的（这是内容工作，得设计新尺子），
      流水线只是让"饱和"变得可见。
    do_not: |
      **不要用饱和套件的单轮差异证明任何改进。** 历史上 52%/83%
      （spread 31pp）就是这么来的 —— 那次读数说明不了任何事。
      也不要把 long 的历史 2/5 当成当前基线：任务数已从 5 扩到 6。

  - id: TD-032
    title: CLI 压平 A1/A2 边界
    status: 已偿还 2026-10-29（安全面）；余下两条是组装边，转入允许清单
    where: cli/admin.py, cli/app.py（仅组装）
    why_now: |
      原状：CLI 直接 import 了控制面与 Web/TUI。`cli/admin.py` 拿着
      `control.store` 建账号 —— 手里有 store 句柄就能改角色、改密码、删账号，
      审计与审批全绕过；`cli/platform.py` 把 `sandbox.run` 原样透传，等于
      CLI 层还有第二个 shell。

      三条都已收口：
      - **探活**：`SandboxProbe` 不再有 `run(command)`，只剩四个固定意图
        （`identity` / `which` / `dir_exists` / `ensure_dir`），实现在 A4 的
        `sandbox/probe.py`；中间那版"命令名闭集"闸门随之删除（没有触发点）。
      - **账号**：`cli/admin.py` 不再构造 `ControlStore`，只调
        `control.bootstrap.create_first_admin()`；该函数在租户下**已有任何账号**
        时拒绝，并提示走 A2 的 `/api/admin/users`。冷启动必须有这条路径 ——
        服务还没起来，走 HTTP 无门。
      - **组装**：`cli/app.py` 仍 import `web` / `tui`，因为 `agent serve` 与
        `agent tui` 本来就是"一个进程里拉起另一层"。这是组装不是越权，
        保留在 `_FROZEN_CLI_EDGES` 里作为允许清单。
    debt_type: 安全
    severity: low
    workaround: |
      两条能力边界都有用例钉住：
      `tests/unit/test_cli_platform_probe.py`（`SandboxProbe` 没有 `run`）、
      `tests/unit/test_admin_bootstrap.py`（已有账号即拒绝、失败也关连接）。
      跨层边冻结在 `tests/unit/test_architecture.py::_FROZEN_CLI_EDGES`，新增即失败。
    owner: 项目作者
    due: 已结清；仅当 CLI 新增"直接改控制面数据"的能力时重新打开
    do_not: |
      不要让 `cli/admin.py` 再碰 `ControlStore` / `UserStore`：账号的增删改查
      只能走 A2 的 `/api/admin/users`，CLI 只保留冷启动那一次。
      不要给 `SandboxProbe` 加回 `run(command)`，也不要把 `sandbox/probe.py`
      扩成"通用命令执行器"——探活的价值就是**只有固定意图**。
      也不要把 `_FROZEN_CLI_EDGES` 当成"允许分子"随手加条目：新增一条边先问
      "这是组装，还是绕过了 A2"。

  - id: TD-033
    title: 依赖图存在已知环，靠延迟 import 维持
    status: 已偿还 2026-10-29（模块级环清零）
    where: orchestrator/scheduler.py, orchestrator/scheduler_run.py, orchestrator/scheduler_plan.py
    why_now: |
      原状：模块级有一处真环 —— `orchestrator.scheduler_run` 顶层 import
      `scheduler`，而 `scheduler` 在函数里反向 import `scheduler_run`。靠
      "晚导入"绕开导入期崩溃，但只要有人把那行挪到顶层就会互相等待初始化，
      而且没人知道这条约束存在。

      处置：把 5 个**纯函数**（依赖判断、implement 下游接线、深度、重试上下文、
      失败兜底结果）下沉到 `orchestrator/scheduler_plan.py`。它们只吃
      `tasks`/`status` 两个字典，本来就与运行态无关。之后
      `scheduler_run → scheduler_plan` 是普通依赖，`scheduler → scheduler_run`
      只剩节点工厂里那一条函数内 import，模块级图重新成为 DAG。

      包级仍然"看起来有环"：`graph ⇄ orchestrator` 与 `config ⇄ llm` 是把
      模块折叠成包之后的假象（各自动的车不同），Python 在乎的是模块级顺序，
      所以断言建在模块粒度。
    debt_type: 架构
    severity: low
    workaround: |
      `tests/unit/test_architecture.py::test_dependency_graph_has_no_new_cycles`
      的已知环基线现在是**空集合**，新增任何环都会红，且修好后不清基线也会红；
      `test_orchestrator_does_not_import_graph_build` 单独盯住最容易闭合的那条边。
    owner: 项目作者
    due: 已结清
    do_not: |
      不要在 orchestrator 里写 `import coding_agent.graph.build`。
      不要把 `scheduler_plan.py` 里的纯函数搬回去 —— 它们回到 `scheduler.py`
      就等于把环重新焊上。
      注意包级环与模块级环不是一回事：折叠成包之后 `graph ⇄ orchestrator`
      看起来一定是环。

  - id: TD-034
    title: A4 之外仍有模块裸跑 sandbox.run
    status: 已偿还 2026-10-29（7 个模块全部迁走，冻结基线清零）
    where: 无（基线为空集合，新增即失败）
    why_now: |
      原来 7 个模块直接在 `sandbox` 上跑命令，绕过 `execution/` 契约层：命令不经
      `classify()` 分级、不进审批闸门、多数也不在工具边界的审计里。
      原先 `test_host_ops.py` 的扫描只扫 `orchestrator/` 一个包，且只认接收者
      名字字面叫 `sandbox` 的 `ast.Name`，所以 `self._sandbox.run(...)` 这类写法
      全都漏网 —— 上面这批是一个都没被看见过的。

      `memory/longterm.py` 已迁走：写锁原来取私有属性 `self._fs._sandbox` 拼
      `mkdir`/`rmdir`/`stat -c %Y` 脚本，现在改用 `SandboxFs` 的目录能力
      （`mkdir` / `mkdir_exclusive` / `rmdir` / `stat().mtime`），记忆层不再需要
      任何 shell。

      `instructions.py` 已迁走：发现仓库指令文件原来是 `sandbox.run("find . ...")`，
      而这条路径的产出会**直接进模型上下文** —— 拼错了就是把任意命令的输出当
      指令注入。现在走 `SandboxFs.find_files()`：调用方只给文件名清单，命令由
      A4 生成，还省掉了"`find` 失败就退回根目录"那条容易腐烂的分支判断。

      `tenancy.py` 已迁走：租户工作区/记忆目录原来是 `sandbox.run("mkdir -p …")`。
      现在走 `SandboxFs.mkdir(path)`，并把允许范围（`workspaces_root` /
      `memory_root`）一起交给 A4 复核 —— 上游已经用 `ensure_inside` 算过一次，
      但"下游照抄上游结论"正是这类越权最容易复发的地方。

      `codeintel/python_index.py` 已迁走：`collect_python_sources` 原来往沙箱里
      塞一段 `python3 - <<EOF` 走全仓库，脚本是拼出来的（内容安全，但形状是
      "任意脚本"）。现在走 `SandboxFs.collect_sources(suffixes, …)`：只给后缀
      清单与三个上限，遍历/读取/截断都由 A4 生成，仍保持**一次**调用（逐文件
      读要 0.2–0.3s/个 `wsl.exe`，两千个文件就是十分钟）。

      `agents/policy.py` 已迁走：仓库画像原来是两条 `find … | wc -l` 拼在一个
      脚本里。现在走 `SandboxFs.count_files({"total": (), "tests": (…)})`：
      分组与上限由调用方声明，`find` 表达式由 A4 生成，**一次调用**拿回全部
      计数（`limit` 用 `head` 截断，超大仓库不必全量遍历）。

      `cli/platform.py` 已迁走：探活改成四个固定意图
      （`identity` / `which` / `dir_exists` / `ensure_dir`），实现在 A4 的
      `sandbox/probe.py`；`cli/app.py` 只是调用方，不再持有命令字符串。

      至此**冻结基线为空**：A4 之外没有任何一处直接调 `sandbox.run`。
    debt_type: 安全
    severity: high
    workaround: |
      清单冻结在 `tests/unit/test_host_ops.py::_FROZEN_DIRECT_RUN_MODULES`，
      扫描范围已扩到全 src 且接受 `${name}.run` / `self._sandbox.run` 两种写法。
      这些调用大多是探活、加锁、清理，逐条迁到 `execution/host_ops.host_run`
      或 `FileAccess` 抽象后才从清单里删掉。
    owner: 项目作者
    due: 任何一处要执行非只读命令之前
    do_not: |
      不要靠"名字里有 sandbox"这条 heuristics 当作万能检测 —— 它是棘轮，
      不是证明。新增这类调用一定会红，但换个接收者名字（且不在已有模块里）
      仍可能溜过，所以每次偿还都要同步缩小清单。

  - id: TD-011
    title: Windows host 后端没有等价 bwrap，exec 仍不是 T2
    where: host_broker/policy.py, host_broker/paths.py, host_broker/win_isolation.py, host_broker/exec.py
    why_now: P0/P1/P2 已加 Job Object、可选低完整性、AppContainer 只读 helper、
      brokered write + 工作区外快照、不可重放、AppContainer 受控 exec 与
      真机红队用例；但 AppContainer exec 只覆盖已注册工具链，toolchain root
      需整树授 RX，超时对孙进程是 best-effort，lowpriv 账户/ACL 部署与
      企业设备注册仍未自动化，仍不是内核级隔离
    debt_type: 安全
    severity: high
    workaround: 默认关闭写/exec；写仍需 grant；exec 只在 appcontainer 档且
      显式注册可信 toolchain；untrusted profile 禁止 host 工作区与 host_exec；
      agent doctor 探测 AppContainer/Job/TPM；不可信仓库留在 sandbox；
      install 永不自动
    owner: 项目作者
    due: 面向不可信仓库开放 host.exec 之前
    do_not: 不要把 user-t1 写成 T2，也不要用“绝对禁止”包装策略 glob；
      不要把 AppContainer exec 描述成内核级隔离，也不要让它接收 shell 字符串
    remaining: |
      三条剩余项，按"能不能靠改代码消除"分类：
      1. **toolchain root 整树授 RX** —— 部署动作（安装器/管理员）。代码侧已按
         root 逐项授权限；验收：`agent doctor` 显示工具链 available，且
         `host.exec` 对未注册工具链返回 denied。
      2. **孙进程硬超时** —— 代码侧只能 best-effort：Job Object 的 kill-on-close
         覆盖直接子进程树，脱离 job 的进程逃不掉。**不要**宣称硬超时。
      3. **lowpriv 账户 / ACL 部署、企业设备注册** —— 部署侧，不在仓内。
      关闭条件：不再面向不可信仓库开放 `host.exec`，或上面三条在部署侧落地
      并有真机验收。仅改代码不会关闭本条 —— 所以 severity 是 high 而 `due`
      是"开放 host.exec 之前"，不是某个版本号。
    boundary: |
      唯一口径：docs/THREAT_MODEL.md §6.1。
      可宣称：T1 + lowpriv/ACL 的 ZX；默认关闭；写需 grant + 工作区外快照 +
      expected_sha256 + op_id 不重放；exec 只接受已注册 toolchain 的 argv、
      不经 shell、仅在 AppContainer 内、默认无网络、只写 output_roots；
      install 永不自动执行；untrusted profile 禁用 host 工作区与 host_exec。
      不可宣称：与 bwrap 等价的文件系统/网络/进程隔离；内核级隔离；对已注册
      toolchain、构建脚本、宿主管理员或提示注入的防护；孙进程硬超时。
      启用前置：仅可信本机仓库；企业需 DEVICE_POLICY=enforce + 签名策略 + TLS；
      不可信仓库必须留在 sandbox。
      禁止措辞：T2 / 内核级隔离 / 沙箱隔离 / 绝对禁止。

