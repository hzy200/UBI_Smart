# 技术债登记簿
#
# 防止 AI（和人）把临时 hack 当成范式复制。
# 每条必须写清：是什么、为什么还没做、**什么时候该还**。
# 与「有意为之的取舍」分开 —— 取舍不进这个表，取舍进 docs/adr/。

version: 1
owner: 项目作者
last_reviewed: 2026-10-27
review_cadence: 每次发版前过一遍；超过 due 的条目必须在 PR 里说明

items:
  - id: TD-002
    title: 思考模式 `reasoning_content` 偶发 400 未修
    where: llm/deepseek.py
    why_now: 根因已查清（langchain-openai 不提取该字段，序列化时不透传
      additional_kwargs），但捕获侧无法稳定复现；不把无法验证的改动放进请求路径
    debt_type: 已知缺陷
    severity: low
    workaround: 用 `DEEPSEEK_MODEL=deepseek-chat`（也是默认值）
    owner: 项目作者
    due: 能稳定复现时
    do_not: 不要凭猜测改请求构造 —— 上一个这么做的人引入了不可验证的改动

  - id: TD-003
    title: 共享文件的并发写默认关闭
    where: orchestrator/implement.py, orchestrator/merge.py
    why_now: 默认用 write_scope 不重叠 + 顺序 patch 合并规避；开启 overlap 后
      用 3-way 预演/合并，真实冲突只回滚共享文件所在分量，冲突自动解决留给后续
    debt_type: 能力缺口
    severity: medium
    workaround: AGENT_ORCHESTRATOR_ALLOW_OVERLAP=true 时用临时 index 3-way 预演，
      真实冲突只回滚所在分量
    owner: 项目作者
    due: 需要多人改同一文件时
    do_not: 不要用"放宽 write_scope 校验"来绕过 —— 那样会留下半合并状态

  - id: TD-004
    title: 模型分层未实现；成本预算已接入调度准入
    where: llm/, orchestrator/scheduler.py
    why_now: 任务级 token 上限与 scheduler 全局准入已接入（implement worker
      会硬停），但预留是同角色历史 EWMA 估算，不是精确 prompt token 计数
    debt_type: 能力缺口
    severity: low
    workaround: CostReport 会报告预算告警；AGENT_ORCHESTRATOR_WORKER_MODEL 可手动分层
    owner: 项目作者
    due: 成本成为瓶颈时
    do_not: 不要把估算值当成精确值写进文档或断言

  - id: TD-005
    title: 检索默认后端是 grep（沙箱未装 ripgrep）
    where: tools/search.py
    why_now: 环境属性；两个后端输出格式一致（grep 分支显式 -E）
    debt_type: 环境
    severity: low
    workaround: 大仓库上会慢；`agent doctor` 显示当前后端
    owner: 环境维护
    due: 沙箱预装 ripgrep 后可自动消除
    do_not: 不要因为慢就改成 shell 拼 grep —— xargs 不在 L0 白名单，会被降级为 L2

  - id: TD-006
    title: 常规短任务评测套件已饱和（default/hard/real/real_advanced/blind 均 100%）
    where: tests/eval/
    why_now: 这些尺子对当前模型没有区分度，继续用它们做 A/B 只会得到 0pp；
      唯一未饱和档 long 任务少、spread 20pp，结论难超噪声
    debt_type: 度量失效
    severity: medium
    workaround: 能力结论改用 long；新任务集按隐藏需求 + 长程多步 + 失败验证成本
      设计，并满足任务数 ≥20、repeat 3、spread <10pp
    owner: 评测维护者
    due: 下次要量化任何改动之前
    do_not: |
      **不要用饱和套件的单轮差异证明任何改进。** 历史上 52%/83%
      （spread 31pp）就是这么来的 —— 那次读数说明不了任何事。
      也不要把 long 的历史 2/5 当成当前基线：任务数已从 5 扩到 6。

  - id: TD-008
    title: 文档里的测试数字多份不一致（1561 / 1661 / 1443 / 1420 / 1403）
    where: README.md, docs/ACCEPTANCE.md, docs/COMPLEXITY.md, docs/TEST_REPORT_*.md
    why_now: 手写数字会过期；README 未纳入本次分层改造
    debt_type: 文档
    severity: low
    plan: |
      数字一律改成"生成命令 + 实测日期"，不再手抄。
      docs/contracts/ 已实现自动生成；README 需单独一次编辑。
    owner: 项目作者
    due: 下次 README 编辑时
    do_not: 不要在各文档之间互相抄数字 —— 抄一次错一次

  - id: TD-011
    title: Windows host 后端没有等价 bwrap，exec 仍不是 T2
    where: host_broker/policy.py, host_broker/paths.py, host_broker/win_isolation.py, host_broker/exec.py
    why_now: P0/P1/P2 已加 Job Object、可选低完整性、AppContainer 只读 helper、
      brokered write + 工作区外快照、不可重放、AppContainer 受控 exec 与
      真机红队用例；但 AppContainer exec 只覆盖已注册工具链，toolchain root
      需整树授 RX，超时对孙进程是 best-effort，lowpriv 账户/ACL 部署与
      企业设备注册仍未自动化，仍不是内核级隔离
    debt_type: 安全
    severity: high
    workaround: 默认关闭写/exec；写仍需 grant；exec 只在 appcontainer 档且
      显式注册可信 toolchain；untrusted profile 禁止 host 工作区与 host_exec；
      agent doctor 探测 AppContainer/Job/TPM；不可信仓库留在 sandbox；
      install 永不自动
    owner: 项目作者
    due: 面向不可信仓库开放 host.exec 之前
    do_not: 不要把 user-t1 写成 T2，也不要用“绝对禁止”包装策略 glob；
      不要把 AppContainer exec 描述成内核级隔离，也不要让它接收 shell 字符串

  - id: TD-012
    title: host/sandbox 跨 kind 编译/验证不支持
    where: execution/router.py, workspace/model.py
    why_now: 批准时选择“源码与产物在同一侧”，避免跨挂载与不一致；跨 kind 需要
      显式同步与新的授权模型
    debt_type: 能力缺口
    severity: medium
    workaround: host 项目全程 host；Linux/不可信项目全程 sandbox；冲突时拒绝
    owner: 项目作者
    due: 出现同一项目既要本机工具链又要 WSL 隔离时
    do_not: 不要用 `/mnt` 或 `\\wsl$` 偷偷桥接 —— 那会绕开路径与加固边界

  - id: TD-013
    title: A2L 是 T4 横向执行面，服务端失陷可触达所有客户端
    where: host_broker/{server,client,acceptor,devices,policy_doc,attestation}.py
    why_now: P0 已有 mTLS/设备指纹、hello nonce、grant one-shot/限流/断线撤销；
      P1/P2 已加本地设备台账/注册吊销 CLI、acceptor 吊销断开、A2L 验签策略、
      软件/TPM 背书密钥的设备证明；但仍无 PCR quote/远程启动证明、无 CSR、
      无控制面 MySQL 设备表、无红队演练，横向风险不能归零
    debt_type: 安全
    severity: high
    workaround: 默认关闭；企业启用 DEVICE_POLICY=enforce + 签名策略 + TLS；
      吊销靠台账重载；agent doctor 显示设备证明可用性；untrusted profile
      禁止 host 工作区与 host_exec；不可信仓库不用 host 后端
    owner: 项目作者
    due: 企业批量分发之前
    do_not: 不要把 TPM CNG 密钥证明写成 PCR/远程证明；不要让服务端推送
      自动更新、下发 grant scope 或替代本地同意

  - id: TD-014
    title: A2L 生命周期管理与企业分发未实现
    where: host_broker/lifecycle.py, desktop/supervisor.py, packaging/
    why_now: P1 只做客户端子进程/托盘；随客户端启停、崩溃恢复、签名更新、
      客户端安装包、设备注册都在 P4
    debt_type: 能力缺口
    severity: medium
    workaround: P1 由客户端 supervisor 拉起/终止；客户端退出时 A2L 必须退出
    owner: 项目作者
    due: 企业批量部署之前
    do_not: 不要把 A2L 做成独立系统服务或开机自启；也不要接服务端静默自动更新

  - id: TD-015
    title: P1 host 工作区只支持 Windows 本地固定 NTFS
    where: host_broker/paths.py, host_broker/store.py
    why_now: 云盘/网络盘/UNC/reparse 的句柄、锁与同步语义不同，P1 直接拒绝；
      Linux/macOS 等价实现未做
    debt_type: 能力缺口
    severity: medium
    workaround: 项目放本地 NTFS；OneDrive/网络盘先同步到本地再注册
    owner: 项目作者
    due: 需要跨平台或网络盘工作区时
    do_not: 不要用字符串判断文件系统类型，也不要用 `/mnt` 或 `\\wsl$` 绕过

