paid_off:
  - id: TD-007
    title: 快照落在工作区内，工作区可写时 agent 能改自己的留底
    resolved: 2026-10-27
    how: 快照内容增加宿主侧 SHA-256 清单（默认 ~/.codingagent/snapshots，
      可用 AGENT_SNAPSHOT_MANIFEST_DIR 重定向到工作区外）；恢复时校验，
      `.absent` 以清单为准。shell 仍可删除快照，但恢复会失败而不是静默还原。
    regression: tests/unit/test_snapshots.py（校验和、篡改拒绝、absent 清单）
    see: src/coding_agent/sandbox/snapshots.py

