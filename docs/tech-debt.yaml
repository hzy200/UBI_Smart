  - id: TD-016
    title: 控制面 SQLite 跨进程计费的 cursor 首次插入竞态
    status: 已偿还 2026-10-29（验证为不会多记，并加了守路径的用例）
    where: control/store.py::record_usage
    why_now: 日用量、配额预留、结算与过期清理已改成条件 UPDATE / 方言
      upsert / 删除后扣减，SQLite 单进程并发不再丢更新。

      原先记录的剩余风险是"两个进程同时看到空 cursor 时各按全量累加，可能
      多记一次"。**2026-10-29 实测推翻了这条**：拿掉进程内 `_USAGE_LOCK`、
      用两个独立 engine 指向同一 SQLite 文件、并放大"读完再写"的窗口（在
      `_daily_add` 前 sleep），20 轮并发里日用量每轮都等于较大的累计值
      （不是两者之和），无异常。

      收敛机制：cursor 是复合主键 (tenant, user, thread_id)，后写的一方必然
      撞唯一键 → 整个事务（含刚加的增量）回滚 → 重试时读到对方已提交的游标，
      按差值补。所以那次重试不是兜底，是正确性的一部分。
    debt_type: 已知缺陷
    severity: low
    workaround: 企业部署仍建议 MySQL（cursor 行锁让路径更直白）；SQLite 的
      限制回到它本身：写事务串行，高并发下会等锁/超时，那时表现为**少记或
      报错**，而不是多记
    owner: 项目作者
    due: 已结清
    do_not: 不要删 `record_usage` 里那个 `except IntegrityError` 重试 ——
      删了就会静默多记一次，
      `test_quota_usage.py::test_concurrent_first_cursor_insert_does_not_double_count`
      会拦住这种改动。
      也不要以为"加了 WAL 就等于加锁了"——WAL 只解决并发写冲突，不解决
      读-改-写的原子性；同样不要把累加改成 Python 侧自增再写回。

