  - id: TD-013
    title: A2L 是 T4 横向执行面，服务端失陷可触达所有客户端
    where: host_broker/{server,client,acceptor,devices,policy_doc,attestation}.py
    why_now: P0 已有 mTLS/设备指纹、hello nonce、grant one-shot/限流/断线撤销；
      P1/P2 已加本地设备台账/注册吊销 CLI、acceptor 吊销断开、A2L 验签策略、
      软件/TPM 背书密钥的设备证明；2026-10-29 补了**服务端失陷方向**的红队
      矩阵（`docs/THREAT_MODEL.md §5.12.1`，R1–R10 逐条对到用例，
      `tests/unit/test_host_broker_redteam.py` 覆盖 R1–R3）；但仍无
      PCR quote/远程启动证明、无 CSR、无控制面 MySQL 设备表，
      acceptor 吊销断开（G1）有实现没测试，横向风险不能归零
    debt_type: 安全
    severity: high
    workaround: 默认关闭；企业启用 DEVICE_POLICY=enforce + 签名策略 + TLS；
      吊销靠台账重载；agent doctor 显示设备证明可用性；untrusted profile
      禁止 host 工作区与 host_exec；不可信仓库不用 host 后端
    owner: 项目作者
    due: 企业批量分发之前
    do_not: 不要把 TPM CNG 密钥证明写成 PCR/远程证明；不要让服务端推送
      自动更新、下发 grant scope 或替代本地同意
    boundary: |
      唯一口径：docs/THREAT_MODEL.md §6.1。
      可宣称：只外连；mTLS/设备指纹；本地设备台账与吊销；签名策略验签；
      TPM 背书密钥或软件 Ed25519 的 nonce 证明；服务端请求不等于授权，
      本地 grant/ZX 是最终闸门；scope/verbs/TTL 不落服务端；one-shot/限流/
      断线撤销；离线降级 sandbox；本地审计链；**服务端失陷方向 R1–R10 有
      本机用例**（§5.12.1）。
