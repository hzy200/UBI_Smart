# 限界上下文映射
#
# 回答三个问题：模块边界在哪、允许依赖谁、改动谁的代码要找谁。
# 决定 Agent 改动的合法范围 —— 跨边界的改动必须显式说明，不能顺手带过。
#
# 事实源：src/ 目录结构 + tests/unit/test_architecture.py（AST 扫描守着依赖方向）

version: 1
owner: 项目作者
last_reviewed: 2026-10-25
review_cadence: 模块边界或依赖方向变动时

# ===========================================================================
# 允许的依赖方向（单向、无环）
# ===========================================================================
dependency_rules:
  - "cli/tui/web/desktop → runtime"
  - "desktop     → web, access, config"
  - "runtime     → graph, orchestrator, sandbox, tools, audit, memory, steering, llm"
  - "graph       → orchestrator, tools, sandbox, llm, messages, config, steering"
  - "orchestrator→ agents, tools, sandbox, llm, codeintel, graph.state, config, steering"
  - "execution    → host_broker.protocol（仅协议 DTO/客户端；不得导入 server/policy）"
  - "host_broker  → (标准库 + protocol；不得导入 tools/graph/runtime/sandbox)"
  - "agents      → tools, sandbox, llm, config, messages"
  - "tools       → sandbox, codeintel, config, diffing"
  - "sandbox     → config, diffing"
  - "llm         → config"
  - "codeintel   → (标准库)"
  - "audit       → (无内部依赖)"

forbidden:
  - from: [cli, tui, web, desktop]
    to: [tools, sandbox]
    why: |
      安全属性，不是代码风格。前端只消费 events.py 的领域事件，
      拿不到工具与沙箱，因此任何界面都绕不过命令分级审批。
    enforced_by: tests/unit/test_architecture.py（AST 扫描）
  - from: [orchestrator]
    to: [cli, tui, web, desktop]
    why: 编排层不知道前端存在
  - from: [sandbox]
    to: [tools, graph, orchestrator]
    why: 安全层必须是最底下的，不能反向依赖调用方
  - from: [cli, tui, web, desktop]
    to: [host_broker]
    why: |
      A1 不得直接触发宿主能力。宿主操作只能经 A2/A3 → A4 → A2L；
      本地同意 UI 由 A2L 自己渲染，前端没有第二执行路径。
    enforced_by: tests/unit/test_architecture.py（AST 扫描）
  - from: [host_broker]
    to: [tools, sandbox, graph, orchestrator, runtime]
    why: |
      A2L 是客户端独立进程，不复用服务端执行/编排代码；
      共享的只有协议 DTO，避免把客户端和服务端安全边界混在一起。

# ===========================================================================
# 上下文清单
# ===========================================================================
contexts:
  - id: orchestration
    name: 编排
    path: [runtime/, graph/]
    owns: [执行入口, 计划与步进, 审批决定, 事件翻译, 审计写入]
    upstream: []
    downstream: [orchestrator, tools, sandbox, audit]
    invariants: 见 docs/ARCHITECTURE.md 第 6 节（56 条）
    change_note: |
      runtime._stream 已拆成主干 + _NODE_HANDLERS 分发表 + _on_* 处理器
      （165 行 / CC 27，commit 9ea2542）。改事件流仍要有
      test_graph_event_coverage.py 与 test_runtime_stream.py 兜底，
      见 docs/COMPLEXITY.md 第 3、7 节。

  - id: harness
    name: 编排子图（harness）
    path: [orchestrator/]
    owns: [仓库画像 survey, 工作流选择, 任务图校验, DAG 调度, worker 派发, fan-in, patch 合并]
    upstream: [graph]
    downstream: [agents, tools, sandbox, codeintel]
    isolation: 独立子图；不复制主 messages，只注入 session_brief
    change_note: |
      任务图校验失败必须整图降级并标记 degraded，不能静默截断。
      并发写是该上下文风险最高的部分，改动前读 src/ubismart/orchestrator/AGENTS.md。

  - id: sandbox
    name: 执行安全层
    path: [sandbox/]
    owns: [WSL2 执行, 命令分级, 路径守卫, 文件读写, 快照, 资源上限]
    upstream: []
    downstream: []
    risk: 最高 —— 全系统唯一"模型意图落地成副作用"的地方
    change_note: 改这里必须对照 docs/THREAT_MODEL.md 第 4 节防线分级

  - id: host-broker
    name: 宿主能力代理（A2L）
    path: [host_broker/]
    owns: [客户端 host 工作区, 本地 workspace→absolute path 映射, 本地 grant/ZX, 工具链能力注册, 本地同意, 本地审计, 本地 op_journal, 出站长连接, 客户端生命周期绑定]
    upstream: []
    downstream: []
    native_on: [Windows, Linux, macOS]
    deployment: 随客户端启动/退出，不独立常驻系统（客户端只有 A1+A2L；A2/A3/A4 在服务器）
    risk: 高 —— T4 横向执行面；服务端失陷时可能被当作内网跳板
    isolation: 独立进程、只外连、不开入站；不导入 tools/graph/runtime/sandbox；不得以 LocalSystem/root 运行
    change_note: |
      动 grant/ZX/路径 canonicalization 必须对照 docs/THREAT_MODEL.md 的 T4
      与 ADR-0015；`user-t1` 档不得对外宣称 T2；默认 lowpriv + ACL。
      P1 根目录只接受本地固定 NTFS，拒绝 OneDrive/网络/UNC/reparse；
      敏感根必须逐次确认。
      Phase 1 只允许只读 op，写/执行/安装必须单独评审。

  - id: capabilities
    name: 能力层
    path: [tools/]
    owns: [shell, 文件, git, 依赖, 检索, 符号, 测试运行, 委派, 审查, 记忆工具]
    upstream: [graph, orchestrator, agents]
    downstream: [sandbox, codeintel]
    change_note: 加工具必须同步 approve.py::tool_level 登记等级 + 重跑 gen_contracts.py

  - id: codeintel
    name: 代码索引
    path: [codeintel/]
    owns: [AST 符号索引, import 图与测试影响分析, 最小 LSP 客户端]
    upstream: [tools, orchestrator]
    downstream: []
    change_note: |
      只读、不写工作区；LSP 未配置时必须降级为 AST 索引。
      索引是静态近似：字面量 importlib.import_module / __import__ 会补进图，
      非字面量动态 import、条件 import 或索引不可用时回退全量验证；
      不要把结果当成类型检查或安全判定的依据。

  - id: subagents
    name: 子智能体
    path: [agents/]
    owns: [explore 只读循环, review 循环, 委派预算策略]
    upstream: [orchestrator, graph]
    downstream: [tools]
    depth: 固定 1，不能再派生

  - id: llm
    name: 模型接入
    path: [llm/]
    owns: [DeepSeek 客户端, provider 路由与冷却, 提示词, 上下文裁剪, 计费]
    upstream: [graph, orchestrator, agents]
    downstream: []
    change_note: 上下文裁剪用字符 + 估算 token 双预算，刻意不引入 tokenizer

  - id: memory
    name: 记忆与持久化
    path: [memory/]
    owns: [checkpoint, 会话索引, 长期记忆]
    upstream: [runtime]
    downstream: [sandbox]
    note: 长期记忆不做 LLM 自动提炼（ADR-0008）

  - id: audit
    name: 审计
    path: [audit/]
    owns: [JSONL 记录, 哈希链, 轮转]
    upstream: [runtime]
    downstream: []
    note: |
      由 runtime 写，不由前端写 —— 任何界面都绕不过。
      写入失败转 RunFailed（宁可显式失败，也不静默丢记录）。

  - id: frontends
    name: 前端
    path: [cli/, tui/, web/, desktop/]
    owns: [事件渲染, 审批交互, 会话管理, 多会话视图隔离, 后台事件流, Web 认证与租户隔离, 桌面壳, 密钥注入, 受控上传, 事件重放]
    upstream: []
    downstream: [runtime]
    constraint: 不得 import tools/ 或 sandbox/（AST 测试守着）
    note: |
      Web 默认 untrusted profile（bwrap + 禁网 + 强制 ask + 不信任仓库指令/记忆），
      只监听 127.0.0.1；公网必须 token + TLS。
      桌面 GUI 只绑 loopback，每次启动随机 token，不允许匿名。

  - id: evaluation
    name: 能力评测
    path: [tests/eval/]
    owns: [任务集, 判定, 基线, 噪声对比, 干预延迟基准]
    upstream: []
    downstream: [runtime]
    note: |
      它是**尺子**不是回归：评测通过率下降只说明能力变了，需要人判断。
      判定固定 stdlib unittest（ADR-0006），仓库用确定性生成器（ADR-0007）。

# ===========================================================================
# 目标四层（Phase A 契约，未落地）
# ===========================================================================
# 当前 contexts 仍是代码事实源；target_layers 只描述未来职责与数据边界，
# 不代表已经存在的包。实现顺序与控制 API 见 docs/PHASE_A.md。
target_layers:
  - id: a1-frontend
    name: 前端
    current_anchors: [web/static/, cli/, tui/, desktop/]
    owns: [交互与渲染, 主题/字体, 每会话视图与 SSE, 实时分屏, 审批交互, 平台桥]
    must_not: [执行工具, 读写工作区, 持有 API Key]

  - id: a2l-host-broker
    name: 宿主能力代理（A2L）
    current_anchors: []
    planned_anchors: [host_broker/, execution/host_backend.py, execution/router.py, workspace/model.py]
    owns: [host 工作区, 本地 workspace→absolute path 映射, 本地 grant/ZX, 工具链能力, 本地同意 UI, 本地审计, 本地 op_journal, 出站长连接, 客户端生命周期绑定]
    data: [host workspace bytes, workspace handle map, grants, toolchain manifest, local audit, op journal]
    deployment: 随客户端启动/退出；A2 只持有 workspace_id + root_handle + a2l_id
    native_on: [Windows, Linux, macOS]
    must_not: [代理 A1 全部流量, 接受服务端下发的 grant scope, 静默安装, 导入服务端执行/编排代码]
    security_tiers: [lowpriv, appcontainer, user-t1]
    note: 默认 lowpriv + ACL；appcontainer 仅受限只读；user-t1 仅 local-dev，是 T1

  - id: a2-control-plane
    name: 控制面
    current_anchors: [web/app.py, web/auth.py, tenancy.py, control/]
    owns: [认证与租户, 会话目录, 运行/审批索引, 配额, Provider 档案, MySQL, SecretProvider]
    data: [MySQL]
    native_on: [Windows, Linux]
    must_not: [执行工具, 直接读写工作区, 存储 checkpoint/文件内容/API Key]

  - id: a3-orchestration
    name: 编排面
    current_anchors: [runtime/, graph/, orchestrator/, llm/, steering.py]
    owns: [图与 LLM, 审批决定, checkpoint, steering, 编排 worker, 成本/限流, 本地审计链]
    data: [checkpoint, steering, audit, memory]
    must_not: [绕过审批执行副作用, 让前端直接调用]

  - id: a4-execution
    name: 执行面
    current_anchors: [tools/, sandbox/, memory/]
    owns: [shell, 文件 I/O, Git, 测试, 快照, worktree, 上传落盘]
    data: [sandbox workspace, snapshots, uploads]
    must_not: [做审批决定, 接受未经 A3 校验的调用, 直接读写 host 工作区]
    note: host 工作区的字节在客户端，由 A2L 持有；A4 只经 typed RPC 调用

target_infrastructure:
  - id: shared-event-transport
    owns: [SSE 热事件发布与重放, 按 thread 保序, consumer group, 短 TTL]
    recommended: Redis Streams
    fallback: 单实例内存适配器
    must_not: [替代 checkpoint, 承担 MySQL 查询索引]
  - id: secrets
    desktop: OS 密钥环（Credential Manager / Secret Service）
    server: Vault/KMS 或 systemd-creds
    wsl: 不落盘；由 A2 按运行注入 A3 内存
  - id: persistence
    control_plane: MySQL（仅 A2）
    standalone: 本地文件/SQLite（CLI/TUI/开发/测试/eval）
  - id: frontend-build
    output: 静态 SPA（CSP 兼容）
    toolchain: esbuild + TypeScript
    framework: none

target_boundaries:
  - "A1 → A2：HTTP + SSE，不直连 A3/A4"
  - "A2 → A3：内部 token + context 的 /v1 生命周期 API；A2 不执行工具"
  - "A2 → A3 未配置 AGENT_INTERNAL_URL 时仍同进程（兼容旧部署）"
  - "A3 → A4：已校验的执行请求；A4 二次强制路径/能力"
  - "A4 → A2L：typed capability RPC；A2L 本地 grant/ZX 是最终判定，服务端不持有 scope"
  - "A1 不直连 A2L 能力 API；本地同意 UI 由 A2L 自己渲染"
  - "A2L 只主动外连，不开入站；断线时 A4 降级 sandbox，不伪装 host 可用"
  - "host 工作区在 NTFS，sandbox 工作区在 ext4；禁止跨挂载与跨 kind 编译/验证"
  - "客户端只部署 A1 + A2L；A2/A3/A4 在服务器原生运行"
  - "WSL 在服务端承载 sandbox 工作区；host 工作区在客户端 NTFS，由 A2L 执行"
  - "A2 是 MySQL 唯一访问方；A3/A4 不直连"
  - "多实例 A3 → 共享事件传输 → A2；MySQL 只做索引"
  - "Standalone：CLI/TUI → A3+A4，无 A2/MySQL"

# ===========================================================================
# 改动范围判定
# ===========================================================================
change_scope:
  - 只动一个 context 内部 → 正常 PR
  - 跨 context 边界 → 必须在 PR 说明为什么，并确认两侧测试都在
  - 动 sandbox 或 approve.py → 对照 THREAT_MODEL 第 4 节，说明防线等级没有下降
  - 动 host_broker/、grant/ZX 或 host/sandbox 路由 → 对照 THREAT_MODEL T4 与 ADR-0015，
    说明 A2L 仍然是“只外连 + 本地最终判定”，且没有新增绕过 A4 的执行路径
  - 动 events.py / config.py / approve.py::tool_level / audit/models.py
    → 必须重跑 `python scripts/gen_contracts.py`（CI 会拦）
