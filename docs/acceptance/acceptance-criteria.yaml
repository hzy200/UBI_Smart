  - id: REQ-265
    title: 结构化干预与 plan_version
    given: 运行中收到 abort / rollback(n) / patch
    when: steering 节点在边界消费
    then: |
      abort 停止并保留已完成部分；rollback 记录步数并在流结束后 rewind；
      patch 只改 contract 字段、递增 plan_version 并触发重规划；
      非法 patch/rollback 直接拒绝。
    status: implemented
    tests: [tests/unit/test_steering.py::test_abort_stops_and_marks_aborted, tests/unit/test_steering.py::test_rollback_stops_and_records_steps, tests/unit/test_steering.py::test_patch_updates_contract_and_plan_version, tests/unit/test_steering.py::test_patch_rejects_unknown_fields, tests/unit/test_runtime_stream.py::test_rollback_rewinds_after_the_stream_stops]
